openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ContentX API — platform-independent AI Content Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content
    description: Canonical content graph operations
  - name: projection
    description: Platform projections
  - name: character
    description: Canonical character and dimension registry operations
  - name: population
    description: Population, dependency rule, and deterministic sampling operations
  - name: agent
    description: Character snapshots and agent runtime operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/content:
    get:
      operationId: listContent
      tags: [content]
      summary: List all content
      responses:
        "200":
          description: Content list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentSummary"
    post:
      operationId: createContent
      tags: [content]
      summary: Generate a content graph from a natural language prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "201":
          description: Created content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
  /v1/scenarios/draft:
    post:
      operationId: draftScenario
      tags: [content]
      summary: Amplify a raw idea into a dramatic scenario draft for user confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioDraftInput"
      responses:
        "200":
          description: Amplified dramatic scenario (not yet committed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DramaticScenario"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI amplification failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios:
    get:
      operationId: listScenarios
      tags: [content]
      summary: List saved scenarios
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
    post:
      operationId: createScenario
      tags: [content]
      summary: Save a scenario to the scenario library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioSaveInput"
      responses:
        "201":
          description: Saved scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}:
    get:
      operationId: getScenario
      tags: [content]
      summary: Get a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateScenario
      tags: [content]
      summary: Update a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdateInput"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteScenario
      tags: [content]
      summary: Delete a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/categories:
    get:
      operationId: listCategories
      tags: [content]
      summary: List all categories (seed + auto-discovered)
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /v1/scenarios/synthesize:
    post:
      operationId: synthesizeScenario
      tags: [content]
      summary: Synthesize a new scenario draft from elements of saved scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeInput"
      responses:
        "200":
          description: Synthesized scenario draft with lineage (not yet persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesizeResult"
        "400":
          description: Invalid input or unknown source scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI synthesis failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/reclassify:
    post:
      operationId: reclassifyScenarios
      tags: [content]
      summary: Re-run classification for all scenarios
      responses:
        "200":
          description: Bulk reclassification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassifyResult"
  /v1/scenarios/{id}/classify:
    post:
      operationId: classifyScenario
      tags: [content]
      summary: Classify (or re-classify) a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario with fresh classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI classification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}/similar:
    get:
      operationId: listSimilarScenarios
      tags: [content]
      summary: Scenarios sharing category axes with the given scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Similar scenarios (shared domain or conflict type)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}:
    get:
      operationId: getContent
      tags: [content]
      summary: Get a content graph (current version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteContent
      tags: [content]
      summary: Delete content and its versions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /v1/content/{id}/entities/{entityId}:
    patch:
      operationId: updateEntity
      tags: [content]
      summary: Update an entity in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/relationships/{relationshipId}:
    patch:
      operationId: updateRelationship
      tags: [content]
      summary: Update a relationship in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: relationshipId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/validate:
    post:
      operationId: validateContent
      tags: [content]
      summary: Validate the content graph (schema, references, duplicates, required fields)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/versions:
    get:
      operationId: listVersions
      tags: [content]
      summary: List versions of a content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionInfo"
    post:
      operationId: createVersion
      tags: [content]
      summary: Snapshot the current graph as a new version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "201":
          description: New version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/export:
    get:
      operationId: exportContent
      tags: [content]
      summary: Export the canonical content graph JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canonical export document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalExport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/projections/roleplayx/{id}:
    get:
      operationId: projectRoleplayX
      tags: [projection]
      summary: Project a content graph to RoleplayX Scenario JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RoleplayX scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleplayXScenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dimensions:
    get:
      operationId: listDimensions
      tags: [character]
      summary: List all registered dimensions
      responses:
        "200":
          description: Dimension list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dimension"
    post:
      operationId: createDimension
      tags: [character]
      summary: Register a new dimension in the registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionInput"
      responses:
        "201":
          description: Registered dimension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        "400":
          description: Invalid dimension definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Dimension name already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters:
    get:
      operationId: listCharacters
      tags: [character]
      summary: List canonical characters
      responses:
        "200":
          description: Character list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [character]
      summary: Create a canonical character (dimension-validated attributes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid character (unknown group/dimension, bad value, MBTI as core attribute)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters/{id}:
    get:
      operationId: getCharacter
      tags: [character]
      summary: Get a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateCharacter
      tags: [character]
      summary: Update a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteCharacter
      tags: [character]
      summary: Delete a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations:
    get:
      operationId: listPopulations
      tags: [population]
      summary: List populations
      responses:
        "200":
          description: Population list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Population"
    post:
      operationId: createPopulation
      tags: [population]
      summary: Create a population (cohort definition over registered dimensions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationInput"
      responses:
        "201":
          description: Created population
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "400":
          description: Invalid population definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}:
    get:
      operationId: getPopulation
      tags: [population]
      summary: Get a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Population
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deletePopulation
      tags: [population]
      summary: Delete a population (cascades rules and sampling audit)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}/dependencies:
    get:
      operationId: listDependencyRules
      tags: [population]
      summary: List statistical dependency rules of a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dependency rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencyRule"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dependencies:
    post:
      operationId: createDependencyRule
      tags: [population]
      summary: Create a statistical dependency rule (separate from semantic relationships)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DependencyRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyRule"
        "400":
          description: Invalid rule (unknown dimension, bad effect, would create a cycle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dependencies/{id}:
    delete:
      operationId: deleteDependencyRule
      tags: [population]
      summary: Delete a dependency rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/sampling:
    post:
      operationId: samplePopulation
      tags: [population]
      summary: Deterministically sample characters from a population (seeded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamplingInput"
      responses:
        "201":
          description: Sampling run (audit) with created character ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingRun"
        "400":
          description: Invalid sampling request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/sampling/{id}:
    get:
      operationId: getSamplingRun
      tags: [population]
      summary: Get a sampling run audit record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sampling run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}/sampling:
    get:
      operationId: listSamplingRuns
      tags: [population]
      summary: List sampling runs of a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sampling run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SamplingRun"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/snapshots:
    get:
      operationId: listSnapshots
      tags: [agent]
      summary: List character snapshots
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CharacterSnapshot"
    post:
      operationId: createSnapshot
      tags: [agent]
      summary: Create an immutable snapshot of a character (agent instantiation source)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotInput"
      responses:
        "201":
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterSnapshot"
        "404":
          description: Character not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/snapshots/{id}:
    get:
      operationId: getSnapshot
      tags: [agent]
      summary: Get a character snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterSnapshot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteSnapshot
      tags: [agent]
      summary: Delete a snapshot (only allowed while never used by a simulation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Snapshot was used by a simulation and is permanent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/agents:
    get:
      operationId: listAgents
      tags: [agent]
      summary: List agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agent]
      summary: Instantiate an agent from an immutable character snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent with initialized state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithState"
        "400":
          description: Invalid goals/constraints/state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [agent]
      summary: Get an agent with its runtime state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent with state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithState"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteAgent
      tags: [agent]
      summary: Delete an agent (cascades runtime state; canonical data untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/agents/{id}/state/{category}:
    patch:
      operationId: updateAgentState
      tags: [agent]
      summary: Merge-update one runtime state category (never touches canonical data)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [affective, relational, motivational, cognitive, behavioral]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStateUpdate"
      responses:
        "200":
          description: Updated state category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentState"
        "400":
          description: Invalid category or values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [content]
      summary: Aggregate stats across the content library
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Entity:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Content primitive kind (character, person, value, trait, capability, population, organization, location, object, event, concept, theme, goal, conflict, emotion, action, dialogue, narrative, rule, constraint, outcome, world)"
        name: { type: string }
        canonicalName:
          type: ["string", "null"]
          description: "Stable canonical identity name; `name` is the display name"
        aliases:
          type: array
          items: { type: string, minLength: 1 }
          description: "Alternative names referring to the same canonical entity"
        description: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: true
    Relationship:
      type: object
      required: [id, source, type, target]
      properties:
        id: { type: string }
        source: { type: string }
        type: { type: string }
        target: { type: string }
        attributes:
          type: object
          additionalProperties: true
    Provenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
        sourceUri: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        sourceContentIds:
          type: array
          items: { type: string }
        generatedByProvider: { type: ["string", "null"] }
        generatedByModel: { type: ["string", "null"] }
        lineage:
          description: Synthesis lineage carried from a synthesized scenario, when the graph was built from one
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Lineage"
    ContentGraph:
      type: object
      required: [id, title, version, createdAt, updatedAt, entities, relationships]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        provenance:
          $ref: "#/components/schemas/Provenance"
    ContentSummary:
      type: object
      required: [id, title, version, createdAt, updatedAt, entityCount, relationshipCount]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
    ContentInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioDraftInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
    ScenarioAct:
      type: object
      required: [name, summary, beats]
      properties:
        name: { type: string }
        summary: { type: string }
        beats:
          type: array
          items: { type: string }
    ScenarioCharacter:
      type: object
      required: [name, role, motivation]
      properties:
        name: { type: string }
        role: { type: string }
        motivation: { type: string }
    DramaticScenario:
      type: object
      required: [title, logline, synopsis, theme, stakes, twist, acts, characters]
      properties:
        title: { type: string }
        logline: { type: string }
        synopsis: { type: string }
        theme: { type: string }
        stakes: { type: string }
        twist: { type: string }
        acts:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioAct"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioCharacter"
        sourceIdea: { type: string }
        amplifiedBy: { type: string }
    ScenarioElement:
      type: string
      enum: [characters, conflict, setting, twist, structure]
      description: Which element to borrow from a source scenario
    SynthesisSource:
      type: object
      required: [scenarioId, elements]
      properties:
        scenarioId: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioElement"
    SynthesizeInput:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/SynthesisSource"
        instruction:
          type: string
          description: Optional free-form guidance for the synthesis
    LineageParent:
      type: object
      required: [scenarioId, title, elements]
      properties:
        scenarioId: { type: string }
        title: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioElement"
    Lineage:
      type: object
      required: [parents]
      properties:
        parents:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/LineageParent"
        instruction: { type: ["string", "null"] }
        synthesizedBy: { type: ["string", "null"] }
    SynthesizeResult:
      type: object
      required: [scenario, lineage]
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioSaveInput:
      type: object
      required: [idea, scenario]
      properties:
        idea:
          type: string
          minLength: 1
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioUpdateInput:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          description: Manual classification override; when present it is stored as-is (no auto-classify)
          $ref: "#/components/schemas/Classification"
    Classification:
      type: object
      required: [domain, conflictType, tone, tags]
      properties:
        domain: { type: string }
        conflictType: { type: string }
        tone: { type: string }
        tags:
          type: array
          items: { type: string }
        classifiedBy: { type: ["string", "null"] }
    Category:
      type: object
      required: [id, axis, name, origin]
      properties:
        id: { type: string }
        axis:
          type: string
          enum: [domain, conflictType, tone]
        name: { type: string }
        description: { type: ["string", "null"] }
        origin:
          type: string
          enum: [seed, auto]
    ReclassifyResult:
      type: object
      required: [classified, failed]
      properties:
        classified: { type: integer }
        failed: { type: integer }
    ScenarioRecord:
      type: object
      required: [id, title, idea, scenario, classification, lineage, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        idea: { type: string }
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          oneOf:
            - $ref: "#/components/schemas/Classification"
            - type: "null"
        lineage:
          oneOf:
            - $ref: "#/components/schemas/Lineage"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
    Dimension:
      type: object
      required: [id, name, category, dataType, source, version]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [demographic, professional, psychological, behavioral, social, preference, capability, technology, domain]
        dataType:
          type: string
          enum: [string, number, boolean, enum, array]
        allowedValues:
          oneOf:
            - type: array
              items: { type: string }
            - type: "null"
        source: { type: string }
        version: { type: integer }
        description: { type: ["string", "null"] }
    DimensionInput:
      type: object
      required: [name, category, dataType]
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        category:
          type: string
          enum: [demographic, professional, psychological, behavioral, social, preference, capability, technology, domain]
        dataType:
          type: string
          enum: [string, number, boolean, enum, array]
        allowedValues:
          type: array
          items: { type: string }
        description: { type: string }
    AttributeMap:
      type: object
      additionalProperties: true
    CharacterAttributes:
      type: object
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/AttributeMap"
        professional:
          $ref: "#/components/schemas/AttributeMap"
        psychological:
          $ref: "#/components/schemas/AttributeMap"
        behavioral:
          $ref: "#/components/schemas/AttributeMap"
        capabilities:
          $ref: "#/components/schemas/AttributeMap"
        preferences:
          $ref: "#/components/schemas/AttributeMap"
        goals:
          type: array
          items: { type: string, minLength: 1 }
        constraints:
          type: array
          items: { type: string, minLength: 1 }
    CharacterProvenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
        populationId: { type: ["string", "null"] }
        seed: { type: ["number", "null"] }
        populationVersion: { type: ["integer", "null"] }
        schemaVersion: { type: ["string", "null"] }
        dependencyGraphVersion: { type: ["string", "null"] }
        sampleIndex: { type: ["integer", "null"] }
        strategy: { type: ["string", "null"] }
        generatedByProvider: { type: ["string", "null"] }
        generatedByModel: { type: ["string", "null"] }
    Character:
      type: object
      required: [id, name, attributes, provenance, schemaVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
        provenance:
          $ref: "#/components/schemas/CharacterProvenance"
        schemaVersion: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    CharacterInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
    CharacterUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
    Distribution:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [categorical, uniform, normal]
        weights:
          type: object
          additionalProperties: { type: number }
        min: { type: number }
        max: { type: number }
        mean: { type: number }
        stddev: { type: number }
        integer: { type: boolean }
    PopulationConstraint:
      type: object
      required: [dimension]
      properties:
        dimension: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    SamplingConfig:
      type: object
      properties:
        defaultStrategy:
          type: string
          enum: [random, weighted, conditional, stratified]
        defaultSampleSize: { type: integer }
    PopulationProvenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
    Population:
      type: object
      required: [id, name, domain, schemaVersion, dimensions, distributions, provenance, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        schemaVersion: { type: string }
        dimensions:
          type: array
          items: { type: string }
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          oneOf:
            - $ref: "#/components/schemas/SamplingConfig"
            - type: "null"
        provenance:
          $ref: "#/components/schemas/PopulationProvenance"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    PopulationInput:
      type: object
      required: [name, domain, dimensions, distributions]
      properties:
        name: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        dimensions:
          type: array
          items: { type: string }
          minItems: 1
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          $ref: "#/components/schemas/SamplingConfig"
    RuleCondition:
      type: object
      properties:
        equals: {}
        in:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    RuleEffect:
      type: object
      properties:
        distribution:
          $ref: "#/components/schemas/Distribution"
        value: {}
        excludedValues:
          type: array
          items: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    DependencyRule:
      type: object
      required: [id, populationId, sourceDimension, targetDimension, type, conditions, effect, provenance, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        populationId: { type: string }
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: ["number", "null"] }
        provenance:
          $ref: "#/components/schemas/PopulationProvenance"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    DependencyRuleInput:
      type: object
      required: [populationId, sourceDimension, targetDimension, type, conditions, effect]
      properties:
        populationId: { type: string }
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
          minItems: 1
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: number }
    SamplingInput:
      type: object
      required: [populationId, sampleSize, strategy, seed]
      properties:
        populationId: { type: string }
        sampleSize: { type: integer, minimum: 1, maximum: 1000 }
        strategy:
          type: string
          enum: [random, weighted, conditional, stratified]
        seed: { type: integer }
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        targetDistribution:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: number }
    SamplingRun:
      type: object
      required: [id, populationId, seed, strategy, sampleSize, requestedDistribution, achievedDistribution, characterIds, populationVersion, schemaVersion, dependencyGraphVersion, createdAt]
      properties:
        id: { type: string }
        populationId: { type: string }
        seed: { type: integer }
        strategy: { type: string }
        sampleSize: { type: integer }
        constraints:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/PopulationConstraint"
            - type: "null"
        targetDistribution:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number }
            - type: "null"
        requestedDistribution:
          type: object
          additionalProperties: true
        achievedDistribution:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        characterIds:
          type: array
          items: { type: string }
        populationVersion: { type: integer }
        schemaVersion: { type: string }
        dependencyGraphVersion: { type: string }
        createdAt: { type: string }
    SnapshotInput:
      type: object
      required: [characterId]
      properties:
        characterId: { type: string }
    BehavioralProfile:
      type: object
      required: [psychological, behavioral, goals, constraints]
      properties:
        psychological:
          type: object
          additionalProperties: true
        behavioral:
          type: object
          additionalProperties: true
        goals:
          type: array
          items: { type: string }
        constraints:
          type: array
          items: { type: string }
    SnapshotProvenance:
      type: object
      required: [operation, createdAt, characterId, characterSchemaVersion]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        characterId: { type: string }
        characterSchemaVersion: { type: string }
        populationId: { type: ["string", "null"] }
        populationVersion: { type: ["integer", "null"] }
        seed: { type: ["number", "null"] }
        dependencyGraphVersion: { type: ["string", "null"] }
        sampleIndex: { type: ["integer", "null"] }
        strategy: { type: ["string", "null"] }
    CharacterSnapshot:
      type: object
      required: [id, characterId, populationId, schemaVersion, dependencyGraphVersion, seed, resolvedAttributes, behavioralProfile, provenance, usedBySimulation, createdAt]
      properties:
        id: { type: string }
        characterId: { type: string }
        populationId: { type: ["string", "null"] }
        schemaVersion: { type: string }
        dependencyGraphVersion: { type: ["string", "null"] }
        seed: { type: ["number", "null"] }
        resolvedAttributes:
          $ref: "#/components/schemas/CharacterAttributes"
        behavioralProfile:
          $ref: "#/components/schemas/BehavioralProfile"
        provenance:
          $ref: "#/components/schemas/SnapshotProvenance"
        usedBySimulation: { type: boolean }
        createdAt: { type: string }
    GoalInput:
      type: object
      required: [objective, priority, urgency, successCriteria]
      properties:
        objective: { type: string, minLength: 1 }
        priority: { type: integer, minimum: 1, maximum: 5 }
        urgency: { type: number, minimum: 0, maximum: 1 }
        successCriteria:
          type: array
          items: { type: string }
    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    AgentConstraintInput:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [hard, soft, policy, environmental]
        description: { type: string, minLength: 1 }
    AgentConstraint:
      allOf:
        - $ref: "#/components/schemas/AgentConstraintInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    AgentProvenance:
      type: object
      required: [operation, createdAt, snapshotId, characterId]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        snapshotId: { type: string }
        characterId: { type: string }
    StateValues:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
      minProperties: 1
    InitialAgentState:
      type: object
      additionalProperties: false
      properties:
        affective:
          $ref: "#/components/schemas/StateValues"
        relational:
          $ref: "#/components/schemas/StateValues"
        motivational:
          $ref: "#/components/schemas/StateValues"
        cognitive:
          $ref: "#/components/schemas/StateValues"
        behavioral:
          $ref: "#/components/schemas/StateValues"
    AgentState:
      type: object
      required: [id, agentId, category, values, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        category:
          type: string
          enum: [affective, relational, motivational, cognitive, behavioral]
        values:
          $ref: "#/components/schemas/StateValues"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    Agent:
      type: object
      required: [id, snapshotId, name, goals, constraints, policy, runtimeConfig, memory, provenance, createdAt, updatedAt]
      properties:
        id: { type: string }
        snapshotId: { type: string }
        name: { type: string }
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraint"
        policy:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        runtimeConfig:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        memory:
          type: array
          items: {}
        provenance:
          $ref: "#/components/schemas/AgentProvenance"
        createdAt: { type: string }
        updatedAt: { type: string }
    AgentWithState:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [state]
          properties:
            state:
              type: object
              required: [affective, relational, motivational, cognitive, behavioral]
              properties:
                affective:
                  $ref: "#/components/schemas/AgentState"
                relational:
                  $ref: "#/components/schemas/AgentState"
                motivational:
                  $ref: "#/components/schemas/AgentState"
                cognitive:
                  $ref: "#/components/schemas/AgentState"
                behavioral:
                  $ref: "#/components/schemas/AgentState"
    AgentInput:
      type: object
      required: [snapshotId, goals, constraints]
      properties:
        snapshotId: { type: string }
        name: { type: string }
        goals:
          type: array
          items:
            $ref: "#/components/schemas/GoalInput"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraintInput"
        policy:
          type: object
          additionalProperties: true
        runtimeConfig:
          type: object
          additionalProperties: true
        initialState:
          $ref: "#/components/schemas/InitialAgentState"
    AgentStateUpdate:
      type: object
      required: [values]
      properties:
        values:
          $ref: "#/components/schemas/StateValues"
    EntityUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: true
    RelationshipUpdate:
      type: object
      properties:
        type: { type: string, minLength: 1 }
        target: { type: string }
        source: { type: string }
        attributes:
          type: object
          additionalProperties: true
    ValidationIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code: { type: string }
        message: { type: string }
        objectId: { type: ["string", "null"] }
    ValidationReport:
      type: object
      required: [valid, checkedAt, issues, checks]
      properties:
        valid: { type: boolean }
        checkedAt: { type: string }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        checks:
          type: array
          items: { type: string }
    VersionInfo:
      type: object
      required: [id, contentId, version, createdAt]
      properties:
        id: { type: string }
        contentId: { type: string }
        version: { type: integer }
        parentVersion: { type: ["integer", "null"] }
        note: { type: ["string", "null"] }
        author: { type: ["string", "null"] }
        createdAt: { type: string }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
    VersionInput:
      type: object
      properties:
        note: { type: string }
        author: { type: string }
    CanonicalExport:
      type: object
      required: [schemaVersion, exportedAt, content]
      properties:
        schemaVersion: { type: string }
        exportedAt: { type: string }
        content:
          $ref: "#/components/schemas/ContentGraph"
    RoleplayXPersona:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        background: { type: ["string", "null"] }
        traits:
          type: array
          items: { type: string }
    RoleplayXScenario:
      type: object
      required: [title, context, playerRole, objectives, successCriteria, personas, recommendedFlow, meta]
      properties:
        title: { type: string }
        context: { type: string }
        playerRole: { type: string }
        objectives:
          type: array
          items: { type: string }
        successCriteria:
          type: array
          items: { type: string }
        personas:
          type: array
          items:
            $ref: "#/components/schemas/RoleplayXPersona"
        recommendedFlow:
          type: array
          items: { type: string }
        meta:
          type: object
          required: [sourceContentId, sourceVersion, projectedAt, adapter]
          properties:
            sourceContentId: { type: string }
            sourceVersion: { type: integer }
            projectedAt: { type: string }
            adapter: { type: string }
    DashboardSummary:
      type: object
      required: [contentCount, entityCount, relationshipCount, versionCount, entityKindCounts, recentContent]
      properties:
        contentCount: { type: integer }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
        versionCount: { type: integer }
        entityKindCounts:
          type: object
          additionalProperties:
            type: integer
        recentContent:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
