openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ContentX API — platform-independent AI Content Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content
    description: Canonical content graph operations
  - name: projection
    description: Platform projections
  - name: character
    description: Canonical character and dimension registry operations
  - name: population
    description: Population, dependency rule, and deterministic sampling operations
  - name: agent
    description: Character snapshots and agent runtime operations
  - name: simulation
    description: Simulation runs, interaction traces, and evaluations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/content:
    get:
      operationId: listContent
      tags: [content]
      summary: List all content
      responses:
        "200":
          description: Content list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentSummary"
    post:
      operationId: createContent
      tags: [content]
      summary: Generate a content graph from a natural language prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "201":
          description: Created content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
  /v1/content/import/matraix:
    post:
      operationId: importMatraixContent
      tags: [content]
      summary: Import a MatrAIx dataset as a canonical content graph
      description: >
        Maps a MatrAIx export (world, populations, personas, relations) into
        canonical entities/relationships with provenance sourceType "matraix",
        and returns the committed graph plus a validation/import report
        (duplicates, broken references). If a graph with the same source.uri
        was imported before, that graph is updated in place as a new version
        (version +1) instead of creating a duplicate, and the report includes
        a diff against the previous graph. With dryRun the mapping, report,
        and re-import diff are returned without committing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatraixImportInput"
      responses:
        "201":
          description: Imported content graph plus import report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatraixImportResult"
        "400":
          description: Invalid MatrAIx dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/draft:
    post:
      operationId: draftScenario
      tags: [content]
      summary: Amplify a raw idea into a dramatic scenario draft for user confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioDraftInput"
      responses:
        "200":
          description: Amplified dramatic scenario (not yet committed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DramaticScenario"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI amplification failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios:
    get:
      operationId: listScenarios
      tags: [content]
      summary: List saved scenarios
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
    post:
      operationId: createScenario
      tags: [content]
      summary: Save a scenario to the scenario library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioSaveInput"
      responses:
        "201":
          description: Saved scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}:
    get:
      operationId: getScenario
      tags: [content]
      summary: Get a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateScenario
      tags: [content]
      summary: Update a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdateInput"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteScenario
      tags: [content]
      summary: Delete a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/categories:
    get:
      operationId: listCategories
      tags: [content]
      summary: List all categories (seed + auto-discovered)
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /v1/scenarios/synthesize:
    post:
      operationId: synthesizeScenario
      tags: [content]
      summary: Synthesize a new scenario draft from elements of saved scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeInput"
      responses:
        "200":
          description: Synthesized scenario draft with lineage (not yet persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesizeResult"
        "400":
          description: Invalid input or unknown source scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI synthesis failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/reclassify:
    post:
      operationId: reclassifyScenarios
      tags: [content]
      summary: Re-run classification for all scenarios
      responses:
        "200":
          description: Bulk reclassification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassifyResult"
  /v1/scenarios/{id}/classify:
    post:
      operationId: classifyScenario
      tags: [content]
      summary: Classify (or re-classify) a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario with fresh classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI classification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}/similar:
    get:
      operationId: listSimilarScenarios
      tags: [content]
      summary: Scenarios sharing category axes with the given scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Similar scenarios (shared domain or conflict type)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}:
    get:
      operationId: getContent
      tags: [content]
      summary: Get a content graph (current version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteContent
      tags: [content]
      summary: Delete content and its versions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /v1/content/{id}/entities/{entityId}:
    patch:
      operationId: updateEntity
      tags: [content]
      summary: Update an entity in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/relationships/{relationshipId}:
    patch:
      operationId: updateRelationship
      tags: [content]
      summary: Update a relationship in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: relationshipId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/validate:
    post:
      operationId: validateContent
      tags: [content]
      summary: Validate the content graph (schema, references, duplicates, required fields)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/versions:
    get:
      operationId: listVersions
      tags: [content]
      summary: List versions of a content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionInfo"
    post:
      operationId: createVersion
      tags: [content]
      summary: Snapshot the current graph as a new version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "201":
          description: New version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/export:
    get:
      operationId: exportContent
      tags: [content]
      summary: Export the canonical content graph JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canonical export document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalExport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/projections:
    post:
      operationId: createProjection
      tags: [projection]
      summary: Project canonical content and/or simulation results to a runtime target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectionInput"
      responses:
        "200":
          description: Projection result (computed, not persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResult"
        "400":
          description: Invalid projection request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Content or simulation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Projection generation failed (provider error or invalid output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/projections/roleplayx/{id}:
    get:
      operationId: projectRoleplayX
      tags: [projection]
      summary: Project a content graph to RoleplayX Scenario JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RoleplayX scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleplayXScenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dimensions:
    get:
      operationId: listDimensions
      tags: [character]
      summary: List all registered dimensions
      responses:
        "200":
          description: Dimension list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dimension"
    post:
      operationId: createDimension
      tags: [character]
      summary: Register a new dimension in the registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionInput"
      responses:
        "201":
          description: Registered dimension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        "400":
          description: Invalid dimension definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Dimension name already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters:
    get:
      operationId: listCharacters
      tags: [character]
      summary: List canonical characters
      responses:
        "200":
          description: Character list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [character]
      summary: Create a canonical character (dimension-validated attributes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid character (unknown group/dimension, bad value, MBTI as core attribute)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters/{id}:
    get:
      operationId: getCharacter
      tags: [character]
      summary: Get a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateCharacter
      tags: [character]
      summary: Update a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteCharacter
      tags: [character]
      summary: Delete a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations:
    get:
      operationId: listPopulations
      tags: [population]
      summary: List populations
      responses:
        "200":
          description: Population list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Population"
    post:
      operationId: createPopulation
      tags: [population]
      summary: Create a population (cohort definition over registered dimensions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationInput"
      responses:
        "201":
          description: Created population
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "400":
          description: Invalid population definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}:
    get:
      operationId: getPopulation
      tags: [population]
      summary: Get a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Population
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: updatePopulation
      tags: [population]
      summary: Update a population (version increments; previous definition kept in history)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationUpdate"
      responses:
        "200":
          description: Updated population (version bumped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "400":
          description: Invalid definition (or existing rules reference removed dimensions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deletePopulation
      tags: [population]
      summary: Delete a population (cascades rules and sampling audit)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}/definition:
    get:
      operationId: getPopulationDefinition
      tags: [population]
      summary: Resolve the exact historical definition + rule set behind a pinned populationVersion + dependencyGraphVersion pair (reproducibility)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: populationVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: dependencyGraphVersion
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Historical population definition and rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopulationDefinitionAt"
        "404":
          description: Population or stored version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}/dependencies:
    get:
      operationId: listDependencyRules
      tags: [population]
      summary: List statistical dependency rules of a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dependency rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencyRule"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dependencies:
    post:
      operationId: createDependencyRule
      tags: [population]
      summary: Create a statistical dependency rule (separate from semantic relationships)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DependencyRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyRule"
        "400":
          description: Invalid rule (unknown dimension, bad effect, would create a cycle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dependencies/{id}:
    put:
      operationId: updateDependencyRule
      tags: [population]
      summary: Update a dependency rule (version increments; graph digest snapshot kept)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DependencyRuleUpdate"
      responses:
        "200":
          description: Updated rule (version bumped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyRule"
        "400":
          description: Invalid rule (unknown dimension, bad effect, would create a cycle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteDependencyRule
      tags: [population]
      summary: Delete a dependency rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/sampling:
    post:
      operationId: samplePopulation
      tags: [population]
      summary: Deterministically sample characters from a population (seeded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamplingInput"
      responses:
        "201":
          description: Sampling run (audit) with created character ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingRun"
        "400":
          description: Invalid sampling request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/sampling/{id}:
    get:
      operationId: getSamplingRun
      tags: [population]
      summary: Get a sampling run audit record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sampling run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}/sampling:
    get:
      operationId: listSamplingRuns
      tags: [population]
      summary: List sampling runs of a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sampling run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SamplingRun"
        "404":
          description: Population not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/snapshots:
    get:
      operationId: listSnapshots
      tags: [agent]
      summary: List character snapshots
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CharacterSnapshot"
    post:
      operationId: createSnapshot
      tags: [agent]
      summary: Create an immutable snapshot of a character (agent instantiation source)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotInput"
      responses:
        "201":
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterSnapshot"
        "404":
          description: Character not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/snapshots/{id}:
    get:
      operationId: getSnapshot
      tags: [agent]
      summary: Get a character snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterSnapshot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteSnapshot
      tags: [agent]
      summary: Delete a snapshot (only allowed while never used by a simulation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Snapshot was used by a simulation and is permanent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/agents:
    get:
      operationId: listAgents
      tags: [agent]
      summary: List agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agent]
      summary: Instantiate an agent from an immutable character snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent with initialized state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithState"
        "400":
          description: Invalid goals/constraints/state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [agent]
      summary: Get an agent with its runtime state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent with state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithState"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteAgent
      tags: [agent]
      summary: Delete an agent (cascades runtime state; canonical data untouched)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/agents/{id}/state/{category}:
    patch:
      operationId: updateAgentState
      tags: [agent]
      summary: Merge-update one runtime state category (never touches canonical data)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [affective, relational, motivational, cognitive, behavioral]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStateUpdate"
      responses:
        "200":
          description: Updated state category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentState"
        "400":
          description: Invalid category or values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/simulations:
    get:
      operationId: listSimulations
      tags: [simulation]
      summary: List simulations
      responses:
        "200":
          description: Simulation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Simulation"
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Create and synchronously run a simulation (agents in a text environment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "201":
          description: Completed simulation with outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "400":
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Agent or snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Agent state changed concurrently during the run; nothing was persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: LLM policy execution failed (provider error or invalid output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/simulations/{id}:
    get:
      operationId: getSimulation
      tags: [simulation]
      summary: Get a simulation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/simulations/{id}/events:
    get:
      operationId: listSimulationEvents
      tags: [simulation]
      summary: Get the immutable interaction trace of a simulation (sequence order)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Interaction events in total order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InteractionEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/evaluations:
    get:
      operationId: listEvaluations
      tags: [simulation]
      summary: List evaluations (optionally filtered by simulation)
      parameters:
        - name: simulationId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Evaluation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evaluation"
    post:
      operationId: evaluateSimulation
      tags: [simulation]
      summary: Run the trace-based evaluation suite over a completed simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationInput"
      responses:
        "201":
          description: Evaluations (behavior + persona fidelity per agent, outcome per simulation)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evaluation"
        "404":
          description: Simulation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/evaluations/{id}:
    get:
      operationId: getEvaluation
      tags: [simulation]
      summary: Get an evaluation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/evaluations/{id}/lineage:
    get:
      operationId: getEvaluationLineage
      tags: [simulation]
      summary: Resolve the full provenance chain of an evaluation back to its source
      description: |
        Walks stored references backwards: evaluation -> simulation -> agents ->
        snapshots -> sampling runs -> populations -> imported content (MatrAIx).
        Every hop is resolved from persisted relationships; a missing hop is a
        409 lineage-broken error, never a silently shortened chain.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved lineage chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationLineage"
        "404":
          description: Evaluation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Lineage broken — a stored reference no longer resolves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [content]
      summary: Aggregate stats across the content library
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Entity:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Content primitive kind (character, person, value, trait, capability, population, organization, location, object, event, concept, theme, goal, conflict, emotion, action, dialogue, narrative, rule, constraint, outcome, world)"
        name: { type: string }
        canonicalName:
          type: ["string", "null"]
          description: "Stable canonical identity name; `name` is the display name"
        aliases:
          type: array
          items: { type: string, minLength: 1 }
          description: "Alternative names referring to the same canonical entity"
        description: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: true
    Relationship:
      type: object
      required: [id, source, type, target]
      properties:
        id: { type: string }
        source: { type: string }
        type: { type: string }
        target: { type: string }
        attributes:
          type: object
          additionalProperties: true
    Provenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
        sourceUri: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        sourceContentIds:
          type: array
          items: { type: string }
        generatedByProvider: { type: ["string", "null"] }
        generatedByModel: { type: ["string", "null"] }
        lineage:
          description: Synthesis lineage carried from a synthesized scenario, when the graph was built from one
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Lineage"
    ContentGraph:
      type: object
      required: [id, title, version, createdAt, updatedAt, entities, relationships]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        provenance:
          $ref: "#/components/schemas/Provenance"
    ContentSummary:
      type: object
      required: [id, title, version, createdAt, updatedAt, entityCount, relationshipCount]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
    ContentInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioDraftInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
    ScenarioAct:
      type: object
      required: [name, summary, beats]
      properties:
        name: { type: string }
        summary: { type: string }
        beats:
          type: array
          items: { type: string }
    ScenarioCharacter:
      type: object
      required: [name, role, motivation]
      properties:
        name: { type: string }
        role: { type: string }
        motivation: { type: string }
    DramaticScenario:
      type: object
      required: [title, logline, synopsis, theme, stakes, twist, acts, characters]
      properties:
        title: { type: string }
        logline: { type: string }
        synopsis: { type: string }
        theme: { type: string }
        stakes: { type: string }
        twist: { type: string }
        acts:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioAct"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioCharacter"
        sourceIdea: { type: string }
        amplifiedBy: { type: string }
    ScenarioElement:
      type: string
      enum: [characters, conflict, setting, twist, structure]
      description: Which element to borrow from a source scenario
    SynthesisSource:
      type: object
      required: [scenarioId, elements]
      properties:
        scenarioId: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioElement"
    SynthesizeInput:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/SynthesisSource"
        instruction:
          type: string
          description: Optional free-form guidance for the synthesis
    LineageParent:
      type: object
      required: [scenarioId, title, elements]
      properties:
        scenarioId: { type: string }
        title: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioElement"
    Lineage:
      type: object
      required: [parents]
      properties:
        parents:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/LineageParent"
        instruction: { type: ["string", "null"] }
        synthesizedBy: { type: ["string", "null"] }
    SynthesizeResult:
      type: object
      required: [scenario, lineage]
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioSaveInput:
      type: object
      required: [idea, scenario]
      properties:
        idea:
          type: string
          minLength: 1
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioUpdateInput:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          description: Manual classification override; when present it is stored as-is (no auto-classify)
          $ref: "#/components/schemas/Classification"
    Classification:
      type: object
      required: [domain, conflictType, tone, tags]
      properties:
        domain: { type: string }
        conflictType: { type: string }
        tone: { type: string }
        tags:
          type: array
          items: { type: string }
        classifiedBy: { type: ["string", "null"] }
    Category:
      type: object
      required: [id, axis, name, origin]
      properties:
        id: { type: string }
        axis:
          type: string
          enum: [domain, conflictType, tone]
        name: { type: string }
        description: { type: ["string", "null"] }
        origin:
          type: string
          enum: [seed, auto]
    ReclassifyResult:
      type: object
      required: [classified, failed]
      properties:
        classified: { type: integer }
        failed: { type: integer }
    ScenarioRecord:
      type: object
      required: [id, title, idea, scenario, classification, lineage, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        idea: { type: string }
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          oneOf:
            - $ref: "#/components/schemas/Classification"
            - type: "null"
        lineage:
          oneOf:
            - $ref: "#/components/schemas/Lineage"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
    Dimension:
      type: object
      required: [id, name, category, dataType, source, version]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [demographic, professional, psychological, behavioral, social, preference, capability, technology, domain]
        dataType:
          type: string
          enum: [string, number, boolean, enum, array]
        allowedValues:
          oneOf:
            - type: array
              items: { type: string }
            - type: "null"
        source: { type: string }
        version: { type: integer }
        description: { type: ["string", "null"] }
    DimensionInput:
      type: object
      required: [name, category, dataType]
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        category:
          type: string
          enum: [demographic, professional, psychological, behavioral, social, preference, capability, technology, domain]
        dataType:
          type: string
          enum: [string, number, boolean, enum, array]
        allowedValues:
          type: array
          items: { type: string }
        description: { type: string }
    AttributeMap:
      type: object
      additionalProperties: true
    CharacterAttributes:
      type: object
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/AttributeMap"
        professional:
          $ref: "#/components/schemas/AttributeMap"
        psychological:
          $ref: "#/components/schemas/AttributeMap"
        behavioral:
          $ref: "#/components/schemas/AttributeMap"
        capabilities:
          $ref: "#/components/schemas/AttributeMap"
        preferences:
          $ref: "#/components/schemas/AttributeMap"
        goals:
          type: array
          items: { type: string, minLength: 1 }
        constraints:
          type: array
          items: { type: string, minLength: 1 }
    CharacterProvenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
        populationId: { type: ["string", "null"] }
        seed: { type: ["number", "null"] }
        populationVersion: { type: ["integer", "null"] }
        schemaVersion: { type: ["string", "null"] }
        dependencyGraphVersion: { type: ["string", "null"] }
        sampleIndex: { type: ["integer", "null"] }
        strategy: { type: ["string", "null"] }
        generatedByProvider: { type: ["string", "null"] }
        generatedByModel: { type: ["string", "null"] }
    Character:
      type: object
      required: [id, name, attributes, provenance, schemaVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
        provenance:
          $ref: "#/components/schemas/CharacterProvenance"
        schemaVersion: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    CharacterInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
    CharacterUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
    Distribution:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [categorical, uniform, normal]
        weights:
          type: object
          additionalProperties: { type: number }
        min: { type: number }
        max: { type: number }
        mean: { type: number }
        stddev: { type: number }
        integer: { type: boolean }
    PopulationConstraint:
      type: object
      required: [dimension]
      properties:
        dimension: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    SamplingConfig:
      type: object
      properties:
        defaultStrategy:
          type: string
          enum: [random, weighted, conditional, stratified]
        defaultSampleSize: { type: integer }
    PopulationProvenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
    Population:
      type: object
      required: [id, name, domain, schemaVersion, dimensions, distributions, provenance, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        schemaVersion: { type: string }
        dimensions:
          type: array
          items: { type: string }
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          oneOf:
            - $ref: "#/components/schemas/SamplingConfig"
            - type: "null"
        provenance:
          $ref: "#/components/schemas/PopulationProvenance"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    PopulationInput:
      type: object
      required: [name, domain, dimensions, distributions]
      properties:
        name: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        dimensions:
          type: array
          items: { type: string }
          minItems: 1
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          $ref: "#/components/schemas/SamplingConfig"
    PopulationUpdate:
      type: object
      description: Partial update; version increments and the previous definition is preserved in history.
      properties:
        name: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        dimensions:
          type: array
          items: { type: string }
          minItems: 1
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          oneOf:
            - $ref: "#/components/schemas/SamplingConfig"
            - type: "null"
    PopulationDefinitionAt:
      type: object
      description: Exact historical definition + rule set behind a pinned version pair.
      required: [population, rules]
      properties:
        population:
          $ref: "#/components/schemas/Population"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DependencyRule"
    RuleCondition:
      type: object
      properties:
        equals: {}
        in:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    RuleEffect:
      type: object
      properties:
        distribution:
          $ref: "#/components/schemas/Distribution"
        value: {}
        excludedValues:
          type: array
          items: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    DependencyRule:
      type: object
      required: [id, populationId, sourceDimension, targetDimension, type, conditions, effect, provenance, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        populationId: { type: string }
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: ["number", "null"] }
        provenance:
          $ref: "#/components/schemas/PopulationProvenance"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    DependencyRuleInput:
      type: object
      required: [populationId, sourceDimension, targetDimension, type, conditions, effect]
      properties:
        populationId: { type: string }
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
          minItems: 1
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: number }
    DependencyRuleUpdate:
      type: object
      description: Partial update; rule version increments and the graph digest snapshot is preserved.
      properties:
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
          minItems: 1
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: ["number", "null"] }
    SamplingInput:
      type: object
      required: [populationId, sampleSize, strategy, seed]
      properties:
        populationId: { type: string }
        sampleSize: { type: integer, minimum: 1, maximum: 1000 }
        populationVersion:
          type: integer
          minimum: 1
          description: Pin sampling to a historical population definition version (reproduce a past run).
        dependencyGraphVersion:
          type: string
          description: Pin sampling to a historical dependency rule set digest (reproduce a past run).
        strategy:
          type: string
          enum: [random, weighted, conditional, stratified]
        seed: { type: integer }
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        targetDistribution:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: number }
    SamplingRun:
      type: object
      required: [id, populationId, seed, strategy, sampleSize, requestedDistribution, achievedDistribution, characterIds, populationVersion, schemaVersion, dependencyGraphVersion, createdAt]
      properties:
        id: { type: string }
        populationId: { type: string }
        seed: { type: integer }
        strategy: { type: string }
        sampleSize: { type: integer }
        constraints:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/PopulationConstraint"
            - type: "null"
        targetDistribution:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number }
            - type: "null"
        requestedDistribution:
          type: object
          additionalProperties: true
        achievedDistribution:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        characterIds:
          type: array
          items: { type: string }
        populationVersion: { type: integer }
        schemaVersion: { type: string }
        dependencyGraphVersion: { type: string }
        createdAt: { type: string }
    SnapshotInput:
      type: object
      required: [characterId]
      properties:
        characterId: { type: string }
    BehavioralProfile:
      type: object
      required: [psychological, behavioral, goals, constraints]
      properties:
        psychological:
          type: object
          additionalProperties: true
        behavioral:
          type: object
          additionalProperties: true
        goals:
          type: array
          items: { type: string }
        constraints:
          type: array
          items: { type: string }
    SnapshotProvenance:
      type: object
      required: [operation, createdAt, characterId, characterSchemaVersion]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        characterId: { type: string }
        characterSchemaVersion: { type: string }
        populationId: { type: ["string", "null"] }
        populationVersion: { type: ["integer", "null"] }
        seed: { type: ["number", "null"] }
        dependencyGraphVersion: { type: ["string", "null"] }
        sampleIndex: { type: ["integer", "null"] }
        strategy: { type: ["string", "null"] }
    CharacterSnapshot:
      type: object
      required: [id, characterId, populationId, schemaVersion, dependencyGraphVersion, seed, resolvedAttributes, behavioralProfile, provenance, usedBySimulation, createdAt]
      properties:
        id: { type: string }
        characterId: { type: string }
        populationId: { type: ["string", "null"] }
        schemaVersion: { type: string }
        dependencyGraphVersion: { type: ["string", "null"] }
        seed: { type: ["number", "null"] }
        resolvedAttributes:
          $ref: "#/components/schemas/CharacterAttributes"
        behavioralProfile:
          $ref: "#/components/schemas/BehavioralProfile"
        provenance:
          $ref: "#/components/schemas/SnapshotProvenance"
        usedBySimulation: { type: boolean }
        createdAt: { type: string }
    GoalInput:
      type: object
      required: [objective, priority, urgency, successCriteria]
      properties:
        objective: { type: string, minLength: 1 }
        priority: { type: integer, minimum: 1, maximum: 5 }
        urgency: { type: number, minimum: 0, maximum: 1 }
        successCriteria:
          type: array
          items: { type: string }
    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    AgentConstraintInput:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [hard, soft, policy, environmental]
        description: { type: string, minLength: 1 }
    AgentConstraint:
      allOf:
        - $ref: "#/components/schemas/AgentConstraintInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    AgentProvenance:
      type: object
      required: [operation, createdAt, snapshotId, characterId]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        snapshotId: { type: string }
        characterId: { type: string }
    StateValues:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
      minProperties: 1
    InitialAgentState:
      type: object
      additionalProperties: false
      properties:
        affective:
          $ref: "#/components/schemas/StateValues"
        relational:
          $ref: "#/components/schemas/StateValues"
        motivational:
          $ref: "#/components/schemas/StateValues"
        cognitive:
          $ref: "#/components/schemas/StateValues"
        behavioral:
          $ref: "#/components/schemas/StateValues"
    AgentState:
      type: object
      required: [id, agentId, category, values, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        category:
          type: string
          enum: [affective, relational, motivational, cognitive, behavioral]
        values:
          $ref: "#/components/schemas/StateValues"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    Agent:
      type: object
      required: [id, snapshotId, name, goals, constraints, policy, runtimeConfig, memory, provenance, createdAt, updatedAt]
      properties:
        id: { type: string }
        snapshotId: { type: string }
        name: { type: string }
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraint"
        policy:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        runtimeConfig:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        memory:
          type: array
          items: {}
        provenance:
          $ref: "#/components/schemas/AgentProvenance"
        createdAt: { type: string }
        updatedAt: { type: string }
    AgentWithState:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [state]
          properties:
            state:
              type: object
              required: [affective, relational, motivational, cognitive, behavioral]
              properties:
                affective:
                  $ref: "#/components/schemas/AgentState"
                relational:
                  $ref: "#/components/schemas/AgentState"
                motivational:
                  $ref: "#/components/schemas/AgentState"
                cognitive:
                  $ref: "#/components/schemas/AgentState"
                behavioral:
                  $ref: "#/components/schemas/AgentState"
    AgentInput:
      type: object
      required: [snapshotId, goals, constraints]
      properties:
        snapshotId: { type: string }
        name: { type: string }
        goals:
          type: array
          items:
            $ref: "#/components/schemas/GoalInput"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraintInput"
        policy:
          type: object
          additionalProperties: true
        runtimeConfig:
          type: object
          additionalProperties: true
        initialState:
          $ref: "#/components/schemas/InitialAgentState"
    AgentStateUpdate:
      type: object
      required: [values]
      properties:
        values:
          $ref: "#/components/schemas/StateValues"
    SimulationInput:
      type: object
      required: [name, topic, agentIds, seed]
      properties:
        name: { type: string, minLength: 1 }
        topic: { type: string, minLength: 1 }
        agentIds:
          type: array
          items: { type: string }
          minItems: 2
        seed: { type: number }
        maxTurns: { type: integer, minimum: 1, maximum: 50 }
        policy:
          type: string
          enum: [heuristic, llm]
        roles:
          type: array
          items: { type: string }
    SimulationParticipant:
      type: object
      required: [agentId, snapshotId, characterId, name, role]
      properties:
        agentId: { type: string }
        snapshotId: { type: string }
        characterId: { type: string }
        name: { type: string }
        role: { type: string }
    SimulationConfig:
      type: object
      required: [topic, maxTurns, policy]
      properties:
        topic: { type: string }
        maxTurns: { type: integer }
        policy:
          type: string
          enum: [heuristic, llm]
    SimulationOutcome:
      type: object
      required: [agreementReached, finalGap, finalPositions, turnsUsed, summary]
      properties:
        agreementReached: { type: boolean }
        finalGap: { type: number }
        finalPositions:
          type: object
          additionalProperties: { type: number }
        turnsUsed: { type: integer }
        summary: { type: string }
    SimulationProvenance:
      type: object
      required: [operation, createdAt, seed, environmentType, policy, modelVersion, snapshotIds]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        seed: { type: number }
        environmentType: { type: string }
        policy: { type: string }
        modelVersion: { type: ["string", "null"] }
        snapshotIds:
          type: array
          items: { type: string }
    Simulation:
      type: object
      required: [id, name, environmentType, config, participants, seed, status, turnsExecuted, outcome, error, provenance, createdAt, completedAt]
      properties:
        id: { type: string }
        name: { type: string }
        environmentType:
          type: string
          enum: [text]
        config:
          $ref: "#/components/schemas/SimulationConfig"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/SimulationParticipant"
        seed: { type: number }
        status:
          type: string
          enum: [completed, failed]
        turnsExecuted: { type: integer }
        outcome:
          oneOf:
            - $ref: "#/components/schemas/SimulationOutcome"
            - type: "null"
        error: { type: ["string", "null"] }
        provenance:
          $ref: "#/components/schemas/SimulationProvenance"
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }
    InteractionEvent:
      type: object
      required: [id, simulationId, sequence, turn, actorId, type, payload, stateBefore, stateAfter, createdAt]
      properties:
        id: { type: string }
        simulationId: { type: string }
        sequence: { type: integer }
        turn: { type: integer }
        actorId: { type: string }
        type:
          type: string
          enum: [observation, action, utterance, decision, toolCall, stateChange, outcome]
        payload:
          type: object
          additionalProperties: true
        stateBefore:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number }
            - type: "null"
        stateAfter:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number }
            - type: "null"
        createdAt: { type: string }
    EvaluationInput:
      type: object
      required: [simulationId]
      properties:
        simulationId: { type: string }
    EvaluationProvenance:
      type: object
      required: [operation, createdAt, simulationId, evaluator, evaluatorVersion, traceEventCount]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        simulationId: { type: string }
        evaluator: { type: string }
        evaluatorVersion: { type: string }
        traceEventCount: { type: integer }
    Evaluation:
      type: object
      required: [id, simulationId, kind, subjectType, subjectId, scores, findings, provenance, createdAt]
      properties:
        id: { type: string }
        simulationId: { type: string }
        kind:
          type: string
          enum: [behavior, personaFidelity, outcome]
        subjectType:
          type: string
          enum: [agent, simulation]
        subjectId: { type: string }
        scores:
          type: object
          additionalProperties: { type: number }
        findings:
          type: object
          additionalProperties: true
        provenance:
          $ref: "#/components/schemas/EvaluationProvenance"
        createdAt: { type: string }
    AgentLineage:
      type: object
      required: [agentId, snapshotId, characterId, samplingRunId, populationId, populationVersion, seed, importId, matraixId, sourceUri]
      properties:
        agentId: { type: string }
        snapshotId: { type: string }
        characterId: { type: string }
        samplingRunId: { type: string, nullable: true }
        populationId: { type: string, nullable: true }
        populationVersion: { type: integer, nullable: true }
        seed: { type: integer, nullable: true }
        importId:
          type: string
          nullable: true
          description: Imported content id the population was bridged from.
        matraixId: { type: string, nullable: true }
        sourceUri: { type: string, nullable: true }
    EvaluationLineage:
      type: object
      required: [evaluationId, kind, simulationId, simulationSeed, agents]
      properties:
        evaluationId: { type: string }
        kind: { type: string }
        simulationId: { type: string }
        simulationSeed: { type: integer }
        agents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AgentLineage"
    ProjectionInput:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum: [roleplayx, novel]
        contentId:
          type: string
          minLength: 1
        simulationId:
          type: string
          minLength: 1
      anyOf:
        - required: [contentId]
        - required: [simulationId]
      description: At least one of contentId or simulationId must be provided.
    CanonicalProvenanceLink:
      type: object
      required: [layer, contentId, contentVersion]
      properties:
        layer:
          type: string
          enum: [canonical]
        contentId:
          type: string
        contentVersion:
          type: integer
    SimulationProvenanceLink:
      type: object
      required: [layer, simulationId, seed, snapshotIds, evaluationIds]
      properties:
        layer:
          type: string
          enum: [simulation]
        simulationId:
          type: string
        seed:
          type: number
        snapshotIds:
          type: array
          items: { type: string }
        evaluationIds:
          type: array
          items: { type: string }
    ProjectionProvenanceLink:
      type: object
      required: [layer, adapter, adapterVersion, modelVersion, projectedAt]
      properties:
        layer:
          type: string
          enum: [projection]
        adapter:
          type: string
        adapterVersion:
          type: string
        modelVersion:
          type: [string, "null"]
          description: LLM model id, or null for deterministic adapters.
        projectedAt:
          type: string
    ProvenanceLink:
      oneOf:
        - $ref: "#/components/schemas/CanonicalProvenanceLink"
        - $ref: "#/components/schemas/SimulationProvenanceLink"
        - $ref: "#/components/schemas/ProjectionProvenanceLink"
    ProjectionResult:
      type: object
      required: [target, payload, provenance]
      properties:
        target:
          type: string
          enum: [roleplayx, novel]
        payload:
          type: object
          additionalProperties: true
          description: Runtime-specific JSON owned entirely by the adapter.
        provenance:
          type: array
          minItems: 2
          maxItems: 3
          description: >-
            Ordered canonical → simulation → projection with at most one link
            per layer; always ends with a projection link. Order/duplicates are
            enforced server-side by the shared projection contract validator.
          items:
            $ref: "#/components/schemas/ProvenanceLink"
    EntityUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: true
    RelationshipUpdate:
      type: object
      properties:
        type: { type: string, minLength: 1 }
        target: { type: string }
        source: { type: string }
        attributes:
          type: object
          additionalProperties: true
    MatraixImportInput:
      type: object
      required: [dataset]
      properties:
        dataset:
          type: object
          description: >
            Raw MatrAIx export payload (schemaVersion "matraix/x.y", personas,
            optional world/populations/relations). Strictly validated in the
            domain layer; unknown keys are rejected.
          additionalProperties: true
        title:
          type: string
          description: Optional title for the imported content graph
        dryRun:
          type: boolean
          description: Map and validate without committing
    MatraixImportStats:
      type: object
      required:
        [worlds, populations, personas, goals, relations, skippedRelations, skippedDuplicates]
      properties:
        worlds: { type: integer }
        populations: { type: integer }
        personas: { type: integer }
        goals: { type: integer }
        relations: { type: integer }
        skippedRelations: { type: integer }
        skippedDuplicates: { type: integer }
    MatraixGraphDiff:
      type: object
      required:
        [
          addedEntities,
          changedEntities,
          removedEntities,
          unchangedEntities,
          addedRelationships,
          changedRelationships,
          removedRelationships,
        ]
      properties:
        addedEntities: { type: integer }
        changedEntities: { type: integer }
        removedEntities: { type: integer }
        unchangedEntities: { type: integer }
        addedRelationships: { type: integer }
        changedRelationships: { type: integer }
        removedRelationships: { type: integer }
    MatraixReimportInfo:
      type: object
      required: [existingContentId, previousVersion, diff]
      properties:
        existingContentId:
          type: string
          description: Id of the existing graph updated instead of duplicated
        previousVersion:
          type: integer
          description: Version of the existing graph before this re-import
        diff:
          $ref: "#/components/schemas/MatraixGraphDiff"
    MatraixImportReport:
      type: object
      required: [importIssues, validation, stats]
      properties:
        importIssues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
          description: Mapping issues (duplicate MatrAIx ids, broken references)
        validation:
          $ref: "#/components/schemas/ValidationReport"
        stats:
          $ref: "#/components/schemas/MatraixImportStats"
        reimport:
          $ref: "#/components/schemas/MatraixReimportInfo"
          description: >
            Present when the dataset's source.uri matched an existing imported
            graph; that graph was updated in place (version +1) instead of
            creating a duplicate, and diff summarizes the changes.
    MatraixImportResult:
      type: object
      required: [content, report]
      properties:
        content:
          $ref: "#/components/schemas/ContentGraph"
        report:
          $ref: "#/components/schemas/MatraixImportReport"
    ValidationIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code: { type: string }
        message: { type: string }
        objectId: { type: ["string", "null"] }
    ValidationReport:
      type: object
      required: [valid, checkedAt, issues, checks]
      properties:
        valid: { type: boolean }
        checkedAt: { type: string }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        checks:
          type: array
          items: { type: string }
    VersionInfo:
      type: object
      required: [id, contentId, version, createdAt]
      properties:
        id: { type: string }
        contentId: { type: string }
        version: { type: integer }
        parentVersion: { type: ["integer", "null"] }
        note: { type: ["string", "null"] }
        author: { type: ["string", "null"] }
        createdAt: { type: string }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
    VersionInput:
      type: object
      properties:
        note: { type: string }
        author: { type: string }
    CanonicalExport:
      type: object
      required: [schemaVersion, exportedAt, content]
      properties:
        schemaVersion: { type: string }
        exportedAt: { type: string }
        content:
          $ref: "#/components/schemas/ContentGraph"
    RoleplayXPersona:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        background: { type: ["string", "null"] }
        traits:
          type: array
          items: { type: string }
    RoleplayXScenario:
      type: object
      required: [title, context, playerRole, objectives, successCriteria, personas, recommendedFlow, meta]
      properties:
        title: { type: string }
        context: { type: string }
        playerRole: { type: string }
        objectives:
          type: array
          items: { type: string }
        successCriteria:
          type: array
          items: { type: string }
        personas:
          type: array
          items:
            $ref: "#/components/schemas/RoleplayXPersona"
        recommendedFlow:
          type: array
          items: { type: string }
        meta:
          type: object
          required: [sourceContentId, sourceVersion, projectedAt, adapter]
          properties:
            sourceContentId: { type: string }
            sourceVersion: { type: integer }
            projectedAt: { type: string }
            adapter: { type: string }
    DashboardSummary:
      type: object
      required: [contentCount, entityCount, relationshipCount, versionCount, entityKindCounts, recentContent]
      properties:
        contentCount: { type: integer }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
        versionCount: { type: integer }
        entityKindCounts:
          type: object
          additionalProperties:
            type: integer
        recentContent:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
