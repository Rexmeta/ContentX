              schema:
                $ref: "#/components/schemas/CommercialValidationRun"
        "422":
          description: Contract or benchmark execution failed
  /v1/commercial-validation/runs/{id}:
    get:
      tags: [Commercial Validation]
      summary: Get a validation run with evidence references
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialValidationRun"
        "404": { description: Validation run not found }
  /v1/commercial-validation/compare:
    post:
      tags: [Commercial Validation]
      summary: Compare two runs and produce a deployment gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baselineRunId, candidateRunId]
              properties:
                baselineRunId: { type: string }
                candidateRunId: { type: string }
      responses:
        "201":
          description: Comparison and deployment decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialComparison"
  /v1/commercial-validation/packages/{id}:
    get:
      tags: [Commercial Validation]
      summary: Download an immutable evidence package
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evidence package JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePackage"
        "404": { description: Evidence package not found }
  /v1/commercial-validation/packages/{id}/verify:
    post:
      tags: [Commercial Validation]
      summary: Verify the checksum of an immutable evidence package
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Checksum verification result
          content:
            application/json:
              schema:
                type: object
                required: [packageId, valid, storedChecksum, calculatedChecksum]
                properties:
                  packageId: { type: string }
                  valid: { type: boolean }
                  storedChecksum: { type: string }
                  calculatedChecksum: { type: string }
        "404": { description: Evidence package not found }
components:
  schemas:
    ReferenceBenchmarkDefinition:
      type: object
      required: [id, version, title, purpose, scenario, cohorts, metrics, seedPolicy]
      properties:
        id: { type: string }
        version: { type: string }
        title: { type: string }
        purpose: { type: string }
        scenario:
          type: object
          required: [title, policy, expectedActions]
          properties:
            title: { type: string }
            policy: { type: string }
            expectedActions: { type: array, items: { type: string } }
        cohorts:
          type: array
          items:
            type: object
            required: [id, label, description]
            properties:
              id: { type: string }
              label: { type: string }
              description: { type: string }
        metrics: { type: array, items: { type: string } }
        seedPolicy: { type: string }
    CommercialValidationRunInput:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }
        sampleSizePerCohort: { type: integer, minimum: 1, maximum: 250, default: 2 }
        repetitions: { type: integer, minimum: 1, maximum: 250, default: 1 }
        baseSeed: { type: integer, default: 20260902 }
        calibrationData: { type: array, items: { type: object, additionalProperties: true } }
    CommercialValidationRun:
      type: object
      required: [id, requestId, agent, status, interactionCount, baseline, stress, failureExplorer, evidencePackageId, correlation]
      properties:
        id: { type: string }
        requestId: { type: string }
        agent: { type: object, additionalProperties: true }
        status: { type: string, enum: [completed, failed] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        sampleSizePerCohort: { type: integer }
        repetitions: { type: integer }
        interactionCount: { type: integer }
        baseline: { type: object, additionalProperties: true }
        stress: { type: object, additionalProperties: true }
        calibrationStatus: { type: string, enum: [CALIBRATED, PROVISIONAL] }
        failureExplorer: { type: array, items: { type: object, additionalProperties: true } }
        evidencePackageId: { type: string }
        correlation: { type: object, additionalProperties: true }
    CommercialComparison:
      type: object
      required: [id, baselineRunId, candidateRunId, deploymentDecision, report]
      properties:
        id: { type: string }
        baselineRunId: { type: string }
        candidateRunId: { type: string }
        deploymentDecision: { type: string, enum: [APPROVED, BLOCKED, WARNING] }
        report: { type: object, additionalProperties: true }
    EvidencePackage:
      type: object
      required: [id, manifest, baseline, stress, failureExplorer, evidence]
      properties:
        id: { type: string }
        manifest: { type: object, additionalProperties: true }
        baseline: { type: object, additionalProperties: true }
        stress: { type: object, additionalProperties: true }
        failureExplorer: { type: array, items: { type: object, additionalProperties: true } }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
    JsonFormatInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        example: {}
        jsonSchema: {}
      oneOf:
        - required: [example]
        - required: [jsonSchema]
    JsonFormatUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        mapping: {}
    JsonFormatVersionInput:
      type: object
      required: [sourceVersion]
      properties: { sourceVersion: { type: integer, minimum: 1 } }
    JsonFormat:
      type: object
      required: [formatId, version, name, status, jsonSchema, mapping, mappingHash, createdAt, updatedAt]
      properties:
        formatId: { type: string }
        version: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [draft, active, superseded] }
        example: {}
        jsonSchema: {}
        mapping: {}
        mappingHash: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JsonFormatInference:
      type: object
      required: [jsonSchema, mapping, unresolvedPaths, sourceCatalog]
      properties:
        jsonSchema: {}
        mapping: {}
        unresolvedPaths: { type: array, items: { type: string } }
        sourceCatalog: { type: array, items: { type: string } }
    JsonExportInput:
      type: object
      required: [formatId]
      properties:
        formatId: { type: string }
        formatVersion: { type: integer }
        contentId: { type: string }
        contentVersion: { type: integer, minimum: 1 }
        simulationId: { type: string }
      anyOf: [{ required: [contentId] }, { required: [simulationId] }]
    JsonExport:
      type: object
      required: [payload, validation, provenance]
      properties:
        payload: {}
        validation:
          type: object
          required: [valid, issues]
          properties: { valid: { type: boolean }, issues: { type: array, items: {} } }
        provenance:
          type: object
          required: [formatId, formatVersion, mappingHash, sourceHash]
          properties:
            formatId: { type: string }
            formatVersion: { type: integer }
            mappingHash: { type: string }
            contentId: { type: string }
            contentVersion: { type: integer }
            simulationId: { type: string }
            sourceHash: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Entity:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Content primitive kind (character, person, value, trait, capability, population, organization, location, object, event, concept, theme, goal, conflict, emotion, action, dialogue, narrative, rule, constraint, outcome, world)"
        name: { type: string }
        canonicalName:
          type: ["string", "null"]
          description: "Stable canonical identity name; `name` is the display name"
        aliases:
          type: array
          items: { type: string, minLength: 1 }
          description: "Alternative names referring to the same canonical entity"
        description: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: true
    Relationship:
      type: object
      required: [id, source, type, target]
      properties:
        id: { type: string }
        source: { type: string }
        type: { type: string }
        target: { type: string }
        attributes:
          type: object
          additionalProperties: true
    Provenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
        sourceUri: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        sourceContentIds:
          type: array
          items: { type: string }
        generatedByProvider: { type: ["string", "null"] }
        generatedByModel: { type: ["string", "null"] }
        lineage:
          description: Synthesis lineage carried from a synthesized scenario, when the graph was built from one
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Lineage"
    ContentGraph:
      type: object
      required: [id, title, version, createdAt, updatedAt, entities, relationships]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        provenance:
          $ref: "#/components/schemas/Provenance"
    ContentSummary:
      type: object
      required: [id, title, version, createdAt, updatedAt, entityCount, relationshipCount]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
    ContentInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioDraftInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
    ScenarioAct:
      type: object
      required: [name, summary, beats]
      properties:
        name: { type: string }
        summary: { type: string }
        beats:
          type: array
          items: { type: string }
    ScenarioCharacter:
      type: object
      required: [name, role, motivation]
      properties:
        name: { type: string }
        role: { type: string }
        motivation: { type: string }
    DramaticScenario:
      type: object
      required: [title, logline, synopsis, theme, stakes, twist, acts, characters]
      properties:
        title: { type: string }
        logline: { type: string }
        synopsis: { type: string }
        theme: { type: string }
        stakes: { type: string }
        twist: { type: string }
        acts:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioAct"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioCharacter"
        sourceIdea: { type: string }
        amplifiedBy: { type: string }
    ScenarioElement:
      type: string
      enum: [characters, conflict, setting, twist, structure, relationship, goal, event, ending]
      description: Which element to borrow from a source scenario
    SynthesisSource:
      type: object
      required: [scenarioId, elements]
      properties:
        scenarioId: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioElement"
    SynthesizeInput:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/SynthesisSource"
        instruction:
          type: string
          description: Optional free-form guidance for the synthesis
    LineageParent:
      type: object
      required: [scenarioId, title, elements]
      properties:
        scenarioId: { type: string }
        title: { type: string }
        elements:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioElement"
        role:
          type: ["string", "null"]
          enum: [source, target, null]
          description: Bridge role — which side of the bridge this parent is (bridge lineage only)
    Lineage:
      type: object
      required: [parents]
      properties:
        kind:
          type: ["string", "null"]
          enum: [synthesis, bridge, null]
          description: How the child was derived; null/synthesis = element remix, bridge = connecting story
        parents:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/LineageParent"
        instruction: { type: ["string", "null"] }
        requirements:
          type: ["array", "null"]
          items: { type: string }
          description: Transition requirements the bridge was generated against (bridge lineage only)
        synthesizedBy: { type: ["string", "null"] }
        bridgeAnalysis:
          description: Connection analysis stored with a bridge scenario; server-validated before persisting (bridge lineage only)
          oneOf:
            - $ref: "#/components/schemas/BridgeAnalysis"
            - type: "null"
    BridgeAnalyzeInput:
      type: object
      required: [sourceScenarioId, targetScenarioId]
      properties:
        sourceScenarioId:
          type: string
          description: Story A — the bridge continues from its ending state
        targetScenarioId:
          type: string
          description: Story B — the bridge must land at its beginning state
    BridgeGapDimension:
      type: string
      enum: [timeline, location, characters, goals, conflict, relationships, knowledge, threads, contradictions]
      description: Gap dimension between the source ending and the target beginning
    BridgeGapItem:
      type: object
      required: [dimension, status, explanation]
      properties:
        dimension:
          $ref: "#/components/schemas/BridgeGapDimension"
        status:
          type: string
          enum: [compatible, transition, conflict]
          description: compatible = ✓, transition = ⚠ requires transition, conflict = ✕
        explanation: { type: string }
        requirement:
          type: ["string", "null"]
          description: Draft transition requirement when status is transition/conflict
    BridgeAnalysis:
      type: object
      required: [summary, gaps, requirements]
      properties:
        summary:
          type: string
          description: AI explanation of why (or why not) a bridge is needed
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/BridgeGapItem"
        requirements:
          type: array
          items: { type: string }
          description: Draft transition requirements the user can adjust before generating
    BridgeGenerateInput:
      type: object
      required: [sourceScenarioId, targetScenarioId, requirements]
      properties:
        sourceScenarioId: { type: string }
        targetScenarioId: { type: string }
        requirements:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
          description: Adjusted transition requirements the bridge must satisfy
        instruction:
          type: string
          maxLength: 500
          description: Optional free-form guidance for the bridge generation (≤500 chars)
        analysis:
          description: Connection analysis from /analyze to persist with the bridge; server re-validates structure before storing
          oneOf:
            - $ref: "#/components/schemas/BridgeAnalysis"
            - type: "null"
    SynthesizeResult:
      type: object
      required: [scenario, lineage]
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioSaveInput:
      type: object
      required: [idea, scenario]
      properties:
        idea:
          type: string
          minLength: 1
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioUpdateInput:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          description: Manual classification override; when present it is stored as-is (no auto-classify)
          $ref: "#/components/schemas/Classification"
    Classification:
      type: object
      required: [domain, conflictType, tone, tags]
      properties:
        domain: { type: string }
        conflictType: { type: string }
        tone: { type: string }
        tags:
          type: array
          items: { type: string }
        classifiedBy: { type: ["string", "null"] }
    Category:
      type: object
      required: [id, axis, name, origin]
      properties:
        id: { type: string }
        axis:
          type: string
          enum: [domain, conflictType, tone]
        name: { type: string }
        description: { type: ["string", "null"] }
        origin:
          type: string
          enum: [seed, auto]
    BenchmarkInput:
      type: object
      required: [scenarioIds]
      properties:
        scenarioIds:
          type: array
          minItems: 2
          items: { type: string }
          description: IDs of reference scenarios (minimum 2; N=1 is rejected)
    CategoryFrequency:
      type: object
      required: [value, count, ratio]
      properties:
        value: { type: string }
        count: { type: integer }
        ratio:
          type: number
          description: Fraction of classified scenarios carrying this value (0–1)
    BenchmarkProfile:
      type: object
      required: [domain, conflictType, tone, tags]
      properties:
        domain:
          type: array
          items: { $ref: "#/components/schemas/CategoryFrequency" }
        conflictType:
          type: array
          items: { $ref: "#/components/schemas/CategoryFrequency" }
        tone:
          type: array
          items: { $ref: "#/components/schemas/CategoryFrequency" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/CategoryFrequency" }
    BenchmarkReport:
      type: object
      required: [scenarioCount, classifiedCount, profile, draftConstraints]
      properties:
        scenarioCount: { type: integer }
        classifiedCount: { type: integer }
        profile:
          $ref: "#/components/schemas/BenchmarkProfile"
        draftConstraints:
          type: string
          description: >
            Constraint text derived from the group profile, ready to inject
            into draft_story as a benchmark constraint. Empty string when
            classifiedCount is 0.
        warning:
          type: ["string", "null"]
          description: Non-fatal advisory (e.g. some scenarios were unclassified)
    ReclassifyResult:
      type: object
      required: [classified, failed]
      properties:
        classified: { type: integer }
        failed: { type: integer }
    ScenarioRecord:
      type: object
      required: [id, title, idea, scenario, classification, lineage, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        idea: { type: string }
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          oneOf:
            - $ref: "#/components/schemas/Classification"
            - type: "null"
        lineage:
          oneOf:
            - $ref: "#/components/schemas/Lineage"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
    Dimension:
      type: object
      required: [id, name, category, dataType, source, version]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [demographic, professional, psychological, behavioral, social, preference, capability, technology, domain]
        dataType:
          type: string
          enum: [string, number, boolean, enum, array]
        allowedValues:
          oneOf:
            - type: array
              items: { type: string }
            - type: "null"
        source: { type: string }
        version: { type: integer }
        description: { type: ["string", "null"] }
    DimensionInput:
      type: object
      required: [name, category, dataType]
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        category:
          type: string
          enum: [demographic, professional, psychological, behavioral, social, preference, capability, technology, domain]
        dataType:
          type: string
          enum: [string, number, boolean, enum, array]
        allowedValues:
          type: array
          items: { type: string }
        description: { type: string }
    AttributeMap:
      type: object
      additionalProperties: true
    CharacterAttributes:
      type: object
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/AttributeMap"
        professional:
          $ref: "#/components/schemas/AttributeMap"
        psychological:
          $ref: "#/components/schemas/AttributeMap"
        behavioral:
          $ref: "#/components/schemas/AttributeMap"
        capabilities:
          $ref: "#/components/schemas/AttributeMap"
        preferences:
          $ref: "#/components/schemas/AttributeMap"
        goals:
          type: array
          items: { type: string, minLength: 1 }
        constraints:
          type: array
          items: { type: string, minLength: 1 }
    CharacterProvenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
        populationId: { type: ["string", "null"] }
        seed: { type: ["number", "null"] }
        populationVersion: { type: ["integer", "null"] }
        schemaVersion: { type: ["string", "null"] }
        dependencyGraphVersion: { type: ["string", "null"] }
        sampleIndex: { type: ["integer", "null"] }
        strategy: { type: ["string", "null"] }
        generatedByProvider: { type: ["string", "null"] }
        generatedByModel: { type: ["string", "null"] }
    Character:
      type: object
      required: [id, name, attributes, provenance, schemaVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
        provenance:
          $ref: "#/components/schemas/CharacterProvenance"
        schemaVersion: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    CharacterInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
    CharacterUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        attributes:
          $ref: "#/components/schemas/CharacterAttributes"
        derivedClassifications:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
    Distribution:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [categorical, uniform, normal]
        weights:
          type: object
          additionalProperties: { type: number }
        min: { type: number }
        max: { type: number }
        mean: { type: number }
        stddev: { type: number }
        integer: { type: boolean }
    PopulationConstraint:
      type: object
      required: [dimension]
      properties:
        dimension: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    SamplingConfig:
      type: object
      properties:
        defaultStrategy:
          type: string
          enum: [random, weighted, conditional, stratified]
        defaultSampleSize: { type: integer }
    PopulationProvenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
    Population:
      type: object
      required: [id, name, domain, schemaVersion, dimensions, distributions, provenance, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        schemaVersion: { type: string }
        dimensions:
          type: array
          items: { type: string }
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          oneOf:
            - $ref: "#/components/schemas/SamplingConfig"
            - type: "null"
        provenance:
          $ref: "#/components/schemas/PopulationProvenance"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    PopulationInput:
      type: object
      required: [name, domain, dimensions, distributions]
      properties:
        name: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        dimensions:
          type: array
          items: { type: string }
          minItems: 1
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          $ref: "#/components/schemas/SamplingConfig"
    PopulationUpdate:
      type: object
      description: Partial update; version increments and the previous definition is preserved in history.
      properties:
        name: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        dimensions:
          type: array
          items: { type: string }
          minItems: 1
        distributions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Distribution"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        samplingConfig:
          oneOf:
            - $ref: "#/components/schemas/SamplingConfig"
            - type: "null"
    PopulationDefinitionAt:
      type: object
      description: Exact historical definition + rule set behind a pinned version pair.
      required: [population, rules]
      properties:
        population:
          $ref: "#/components/schemas/Population"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DependencyRule"
    RuleCondition:
      type: object
      properties:
        equals: {}
        in:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    RuleEffect:
      type: object
      properties:
        distribution:
          $ref: "#/components/schemas/Distribution"
        value: {}
        excludedValues:
          type: array
          items: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        min: { type: number }
        max: { type: number }
    DependencyRule:
      type: object
      required: [id, populationId, sourceDimension, targetDimension, type, conditions, effect, provenance, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        populationId: { type: string }
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: ["number", "null"] }
        provenance:
          $ref: "#/components/schemas/PopulationProvenance"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    DependencyRuleInput:
      type: object
      required: [populationId, sourceDimension, targetDimension, type, conditions, effect]
      properties:
        populationId: { type: string }
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
          minItems: 1
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: number }
    DependencyRuleUpdate:
      type: object
      description: Partial update; rule version increments and the graph digest snapshot is preserved.
      properties:
        sourceDimension: { type: string }
        targetDimension: { type: string }
        type:
          type: string
          enum: [conditional, constraint, exclusion, implication, correlation]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
          minItems: 1
        effect:
          $ref: "#/components/schemas/RuleEffect"
        strength: { type: ["number", "null"] }
    SamplingInput:
      type: object
      required: [populationId, sampleSize, strategy, seed]
      properties:
        populationId: { type: string }
        sampleSize: { type: integer, minimum: 1, maximum: 1000 }
        populationVersion:
          type: integer
          minimum: 1
          description: Pin sampling to a historical population definition version (reproduce a past run).
        dependencyGraphVersion:
          type: string
          description: Pin sampling to a historical dependency rule set digest (reproduce a past run).
        strategy:
          type: string
          enum: [random, weighted, conditional, stratified]
        seed: { type: integer }
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/PopulationConstraint"
        targetDistribution:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: number }
    SamplingRun:
      type: object
      required: [id, populationId, seed, strategy, sampleSize, requestedDistribution, achievedDistribution, characterIds, populationVersion, schemaVersion, dependencyGraphVersion, createdAt]
      properties:
        id: { type: string }
        populationId: { type: string }
        seed: { type: integer }
        strategy: { type: string }
        sampleSize: { type: integer }
        constraints:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/PopulationConstraint"
            - type: "null"
        targetDistribution:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number }
            - type: "null"
        requestedDistribution:
          type: object
          additionalProperties: true
        achievedDistribution:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        characterIds:
          type: array
          items: { type: string }
        populationVersion: { type: integer }
        schemaVersion: { type: string }
        dependencyGraphVersion: { type: string }
        createdAt: { type: string }
    SnapshotInput:
      type: object
      required: [characterId]
      properties:
        characterId: { type: string }
    BehavioralProfile:
      type: object
      required: [psychological, behavioral, goals, constraints]
      properties:
        psychological:
          type: object
          additionalProperties: true
        behavioral:
          type: object
          additionalProperties: true
        goals:
          type: array
          items: { type: string }
        constraints:
          type: array
          items: { type: string }
    SnapshotProvenance:
      type: object
      required: [operation, createdAt, characterId, characterSchemaVersion]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        characterId: { type: string }
        characterSchemaVersion: { type: string }
        populationId: { type: ["string", "null"] }
        populationVersion: { type: ["integer", "null"] }
        seed: { type: ["number", "null"] }
        dependencyGraphVersion: { type: ["string", "null"] }
        sampleIndex: { type: ["integer", "null"] }
        strategy: { type: ["string", "null"] }
    CharacterSnapshot:
      type: object
      required: [id, characterId, populationId, schemaVersion, dependencyGraphVersion, seed, resolvedAttributes, behavioralProfile, provenance, usedBySimulation, createdAt]
      properties:
        id: { type: string }
        characterId: { type: string }
        populationId: { type: ["string", "null"] }
        schemaVersion: { type: string }
        dependencyGraphVersion: { type: ["string", "null"] }
        seed: { type: ["number", "null"] }
        resolvedAttributes:
          $ref: "#/components/schemas/CharacterAttributes"
        behavioralProfile:
          $ref: "#/components/schemas/BehavioralProfile"
        provenance:
          $ref: "#/components/schemas/SnapshotProvenance"
        usedBySimulation: { type: boolean }
        createdAt: { type: string }
    GoalInput:
      type: object
      required: [objective, priority, urgency, successCriteria]
      properties:
        objective: { type: string, minLength: 1 }
        priority: { type: integer, minimum: 1, maximum: 5 }
        urgency: { type: number, minimum: 0, maximum: 1 }
        successCriteria:
          type: array
          items: { type: string }
    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    AgentConstraintInput:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [hard, soft, policy, environmental]
        description: { type: string, minLength: 1 }
    AgentConstraint:
      allOf:
        - $ref: "#/components/schemas/AgentConstraintInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    AgentProvenance:
      type: object
      required: [operation, createdAt, snapshotId, characterId]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        snapshotId: { type: string }
        characterId: { type: string }
    StateValues:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
      minProperties: 1
    InitialAgentState:
      type: object
      additionalProperties: false
      properties:
        affective:
          $ref: "#/components/schemas/StateValues"
        relational:
          $ref: "#/components/schemas/StateValues"
        motivational:
          $ref: "#/components/schemas/StateValues"
        cognitive:
          $ref: "#/components/schemas/StateValues"
        behavioral:
          $ref: "#/components/schemas/StateValues"
    AgentState:
      type: object
      required: [id, agentId, category, values, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        category:
          type: string
          enum: [affective, relational, motivational, cognitive, behavioral]
        values:
          $ref: "#/components/schemas/StateValues"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    Agent:
      type: object
      required: [id, snapshotId, name, goals, constraints, policy, runtimeConfig, memory, provenance, createdAt, updatedAt]
      properties:
        id: { type: string }
        snapshotId: { type: string }
        name: { type: string }
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraint"
        policy:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        runtimeConfig:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        memory:
          type: array
          items: {}
        provenance:
          $ref: "#/components/schemas/AgentProvenance"
        createdAt: { type: string }
        updatedAt: { type: string }
    AgentWithState:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [state]
          properties:
            state:
              type: object
              required: [affective, relational, motivational, cognitive, behavioral]
              properties:
                affective:
                  $ref: "#/components/schemas/AgentState"
                relational:
                  $ref: "#/components/schemas/AgentState"
                motivational:
                  $ref: "#/components/schemas/AgentState"
                cognitive:
                  $ref: "#/components/schemas/AgentState"
                behavioral:
                  $ref: "#/components/schemas/AgentState"
    AgentInput:
      type: object
      required: [snapshotId, goals, constraints]
      properties:
        snapshotId: { type: string }
        name: { type: string }
        goals:
          type: array
          items:
            $ref: "#/components/schemas/GoalInput"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraintInput"
        policy:
          type: object
          additionalProperties: true
        runtimeConfig:
          type: object
          additionalProperties: true
        initialState:
          $ref: "#/components/schemas/InitialAgentState"
    AgentStateUpdate:
      type: object
      required: [values]
      properties:
        values:
          $ref: "#/components/schemas/StateValues"
    SimulationInput:
      type: object
      required: [name, topic, agentIds, seed]
      properties:
        name: { type: string, minLength: 1 }
        topic: { type: string, minLength: 1 }
        agentIds:
          type: array
          items: { type: string }
          minItems: 2
        seed: { type: number }
        maxTurns: { type: integer, minimum: 1, maximum: 50 }
        policy:
          type: string
          enum: [heuristic, llm]
        roles:
          type: array
          items: { type: string }
    SimulationParticipant:
      type: object
      required: [agentId, snapshotId, characterId, name, role]
      properties:
        agentId: { type: string }
        snapshotId: { type: string }
        characterId: { type: string }
        name: { type: string }
        role: { type: string }
    SimulationConfig:
      type: object
      required: [topic, maxTurns, policy]
      properties:
        topic: { type: string }
        maxTurns: { type: integer }
        policy:
          type: string
          enum: [heuristic, llm]
    SimulationOutcome:
      type: object
      required: [agreementReached, finalGap, finalPositions, turnsUsed, summary]
      properties:
        agreementReached: { type: boolean }
        finalGap: { type: number }
        finalPositions:
          type: object
          additionalProperties: { type: number }
        turnsUsed: { type: integer }
        summary: { type: string }
    SimulationProvenance:
      type: object
      required: [operation, createdAt, seed, environmentType, policy, modelVersion, snapshotIds]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        seed: { type: number }
        environmentType: { type: string }
        policy: { type: string }
        modelVersion: { type: ["string", "null"] }
        snapshotIds:
          type: array
          items: { type: string }
    Simulation:
      type: object
      required: [id, name, environmentType, config, participants, seed, status, turnsExecuted, outcome, error, provenance, createdAt, completedAt]
      properties:
        id: { type: string }
        name: { type: string }
        environmentType:
          type: string
          enum: [text]
        config:
          $ref: "#/components/schemas/SimulationConfig"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/SimulationParticipant"
        seed: { type: number }
        status:
          type: string
          enum: [completed, failed]
        turnsExecuted: { type: integer }
        outcome:
          oneOf:
            - $ref: "#/components/schemas/SimulationOutcome"
            - type: "null"
        error: { type: ["string", "null"] }
        provenance:
          $ref: "#/components/schemas/SimulationProvenance"
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }
    InteractionEvent:
      type: object
      required: [id, simulationId, sequence, turn, actorId, type, payload, stateBefore, stateAfter, createdAt]
      properties:
        id: { type: string }
        simulationId: { type: string }
        sequence: { type: integer }
        turn: { type: integer }
        actorId: { type: string }
        type:
          type: string
          enum: [observation, action, utterance, decision, toolCall, stateChange, outcome]
        payload:
          type: object
          additionalProperties: true
        stateBefore:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number }
            - type: "null"
        stateAfter:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number }
            - type: "null"
        createdAt: { type: string }
    EvaluationInput:
      type: object
      required: [simulationId]
      properties:
        simulationId: { type: string }
    EvaluationProvenance:
      type: object
      required: [operation, createdAt, simulationId, evaluator, evaluatorVersion, traceEventCount]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        simulationId: { type: string }
        evaluator: { type: string }
        evaluatorVersion: { type: string }
        traceEventCount: { type: integer }
    Evaluation:
      type: object
      required: [id, simulationId, kind, subjectType, subjectId, scores, findings, provenance, createdAt]
      properties:
        id: { type: string }
        simulationId: { type: string }
        kind:
          type: string
          enum: [behavior, personaFidelity, outcome]
        subjectType:
          type: string
          enum: [agent, simulation]
        subjectId: { type: string }
        scores:
          type: object
          additionalProperties: { type: number }
        findings:
          type: object
          additionalProperties: true
        provenance:
          $ref: "#/components/schemas/EvaluationProvenance"
        createdAt: { type: string }
    AgentLineage:
      type: object
      required: [agentId, snapshotId, characterId, samplingRunId, populationId, populationVersion, seed, importId, matraixId, sourceUri]
      properties:
        agentId: { type: string }
        snapshotId: { type: string }
        characterId: { type: string }
        samplingRunId: { type: string, nullable: true }
        populationId: { type: string, nullable: true }
        populationVersion: { type: integer, nullable: true }
        seed: { type: integer, nullable: true }
        importId:
          type: string
          nullable: true
          description: Imported content id the population was bridged from.
        matraixId: { type: string, nullable: true }
        sourceUri: { type: string, nullable: true }
    EvaluationLineage:
      type: object
      required: [evaluationId, kind, simulationId, simulationSeed, agents]
      properties:
        evaluationId: { type: string }
        kind: { type: string }
        simulationId: { type: string }
        simulationSeed: { type: integer }
        agents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AgentLineage"
    ProjectionInput:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum: [roleplayx, novel, business]
        contentId:
          type: string
          minLength: 1
        simulationId:
          type: string
          minLength: 1
      anyOf:
        - required: [contentId]
        - required: [simulationId]
      description: At least one of contentId or simulationId must be provided.
    CanonicalProvenanceLink:
      type: object
      required: [layer, contentId, contentVersion]
      properties:
        layer:
          type: string
          enum: [canonical]
        contentId:
          type: string
        contentVersion:
          type: integer
    SimulationProvenanceLink:
      type: object
      required: [layer, simulationId, seed, snapshotIds, evaluationIds]
      properties:
        layer:
          type: string
          enum: [simulation]
        simulationId:
          type: string
        seed:
          type: number
        snapshotIds:
          type: array
          items: { type: string }
        evaluationIds:
          type: array
          items: { type: string }
    ProjectionProvenanceLink:
      type: object
      required: [layer, adapter, adapterVersion, modelVersion, projectedAt]
      properties:
        layer:
          type: string
          enum: [projection]
        adapter:
          type: string
        adapterVersion:
          type: string
        modelVersion:
          type: [string, "null"]
          description: LLM model id, or null for deterministic adapters.
        projectedAt:
          type: string
    ProvenanceLink:
      oneOf:
        - $ref: "#/components/schemas/CanonicalProvenanceLink"
        - $ref: "#/components/schemas/SimulationProvenanceLink"
        - $ref: "#/components/schemas/ProjectionProvenanceLink"
    ProjectionResult:
      type: object
      required: [target, payload, provenance]
      properties:
        target:
          type: string
          enum: [roleplayx, novel, business]
        payload:
          type: object
          additionalProperties: true
          description: Runtime-specific JSON owned entirely by the adapter.
        provenance:
          type: array
          minItems: 2
          maxItems: 3
          description: >-
            Ordered canonical → simulation → projection with at most one link
            per layer; always ends with a projection link. Order/duplicates are
            enforced server-side by the shared projection contract validator.
          items:
            $ref: "#/components/schemas/ProvenanceLink"
    EntityUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        canonicalName: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: true
    RelationshipUpdate:
      type: object
      properties:
        type: { type: string, minLength: 1 }
        target: { type: string }
        source: { type: string }
        attributes:
          type: object
          additionalProperties: true
    MatraixImportInput:
      type: object
      required: [dataset]
      properties:
        dataset:
          type: object
          description: >
            Raw MatrAIx export payload (schemaVersion "matraix/x.y", personas,
            optional world/populations/relations). Strictly validated in the
            domain layer; unknown keys are rejected.
          additionalProperties: true
        title:
          type: string
          description: Optional title for the imported content graph
        dryRun:
          type: boolean
          description: Map and validate without committing
    MatraixImportStats:
      type: object
      required:
        [worlds, populations, personas, goals, relations, skippedRelations, skippedDuplicates]
      properties:
        worlds: { type: integer }
        populations: { type: integer }
        personas: { type: integer }
        goals: { type: integer }
        relations: { type: integer }
        skippedRelations: { type: integer }
        skippedDuplicates: { type: integer }
    MatraixGraphDiff:
      type: object
      required:
        [
          addedEntities,
          changedEntities,
          removedEntities,
          unchangedEntities,
          addedRelationships,
          changedRelationships,
          removedRelationships,
        ]
      properties:
        addedEntities: { type: integer }
        changedEntities: { type: integer }
        removedEntities: { type: integer }
        unchangedEntities: { type: integer }
        addedRelationships: { type: integer }
        changedRelationships: { type: integer }
        removedRelationships: { type: integer }
    MatraixReimportInfo:
      type: object
      required: [existingContentId, previousVersion, diff]
      properties:
        existingContentId:
          type: string
          description: Id of the existing graph updated instead of duplicated
        previousVersion:
          type: integer
          description: Version of the existing graph before this re-import
        diff:
          $ref: "#/components/schemas/MatraixGraphDiff"
    MatraixImportReport:
      type: object
      required: [importIssues, validation, stats]
      properties:
        importIssues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
          description: Mapping issues (duplicate MatrAIx ids, broken references)
        validation:
          $ref: "#/components/schemas/ValidationReport"
        stats:
          $ref: "#/components/schemas/MatraixImportStats"
        reimport:
          $ref: "#/components/schemas/MatraixReimportInfo"
          description: >
            Present when the dataset's source.uri matched an existing imported
            graph; that graph was updated in place (version +1) instead of
            creating a duplicate, and diff summarizes the changes.
    MatraixImportResult:
      type: object
      required: [content, report]
      properties:
        content:
          $ref: "#/components/schemas/ContentGraph"
        report:
          $ref: "#/components/schemas/MatraixImportReport"
    ValidationIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code: { type: string }
        message: { type: string }
        objectId: { type: ["string", "null"] }
    ValidationReport:
      type: object
      required: [valid, checkedAt, issues, checks]
      properties:
        valid: { type: boolean }
        checkedAt: { type: string }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        checks:
          type: array
          items: { type: string }
    VersionInfo:
      type: object
      required: [id, contentId, version, createdAt]
      properties:
        id: { type: string }
        contentId: { type: string }
        version: { type: integer }
        parentVersion: { type: ["integer", "null"] }
        note: { type: ["string", "null"] }
        author: { type: ["string", "null"] }
        createdAt: { type: string }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
    VersionInput:
      type: object
      properties:
        note: { type: string }
        author: { type: string }
    CanonicalExport:
      type: object
      required: [schemaVersion, exportedAt, content]
      properties:
        schemaVersion: { type: string }
        exportedAt: { type: string }
        content:
          $ref: "#/components/schemas/ContentGraph"
    RoleplayXPersona:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        background: { type: ["string", "null"] }
        traits:
          type: array
          items: { type: string }
    RoleplayXScenario:
      type: object
      required: [title, context, playerRole, objectives, successCriteria, personas, recommendedFlow, meta]
      properties:
        title: { type: string }
        context: { type: string }
        playerRole: { type: string }
        objectives:
          type: array
          items: { type: string }
        successCriteria:
          type: array
          items: { type: string }
        personas:
          type: array
          items:
            $ref: "#/components/schemas/RoleplayXPersona"
        recommendedFlow:
          type: array
          items: { type: string }
        meta:
          type: object
          required: [sourceContentId, sourceVersion, projectedAt, adapter]
          properties:
            sourceContentId: { type: string }
            sourceVersion: { type: integer }
            projectedAt: { type: string }
            adapter: { type: string }
    DashboardSummary:
      type: object
      required: [contentCount, entityCount, relationshipCount, versionCount, entityKindCounts, recentContent]
      properties:
        contentCount: { type: integer }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
        versionCount: { type: integer }
        entityKindCounts:
          type: object
          additionalProperties:
            type: integer
        recentContent:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
    OutputIntent:
      type: object
      required: [outputType, description, extractedInputs]
      properties:
        outputType:
          type: string
          enum: [movie, novel, roleplay, product-reaction, game, advertisement, remix, external-transform]
        description:
          type: string
          description: "User's original wording (empty when a choice was used without a description)"
        extractedInputs:
          type: object
          additionalProperties: { type: string }
          description: "AI-extracted inputs, e.g. { idea: ..., product: ..., audience: ... }"
    WorkflowStepBinding:
      type: object
      required: [action, api]
      properties:
        action:
          type: string
          description: "Executor action key (e.g. draft_story, generate_personas, run_simulation)"
        api:
          type: string
          description: "Human-readable existing API the step reuses (e.g. POST /v1/sampling)"
        params:
          type: object
          additionalProperties: true
    WorkflowProgressEvent:
      type: object
      required: [phase, label, status, at]
      properties:
        phase:
          type: string
          description: "Stable machine-readable generation phase"
        label:
          type: string
          description: "Safe user-facing description of the work in progress"
        status:
          type: string
          enum: [running, complete, failed]
        at:
          type: string
          description: "ISO-8601 timestamp when this phase changed"
    WorkflowCheckpointDetail:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    WorkflowCheckpoint:
      type: object
      required: [kind, title, summary, details, at]
      properties:
        kind:
          type: string
          enum: [input, preview, validation, handoff, review]
        title:
          type: string
          description: "Safe user-facing checkpoint title"
        summary:
          type: string
          description: "Safe summary derived from explicit inputs or domain output"
        details:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowCheckpointDetail"
        at: { type: string }
    WorkflowStepReview:
      type: object
      required: [status, requestedAt]
      properties:
        status:
          type: string
          enum: [pending, approved]
        requestedAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
        edits:
          type: array
          description: "Reviewer changes, retained separately from the original AI output"
          items:
            $ref: "#/components/schemas/WorkflowStepReviewEdit"
    WorkflowStepReviewEdit:
      type: object
      required: [field, originalValue, editedValue]
      properties:
        field: { type: string }
        originalValue: { type: string }
        editedValue: { type: string }
    WorkflowStepProgress:
      type: object
      required: [runId, startedAt, updatedAt, events]
      properties:
        runId:
          type: string
          description: "Execution ownership token used to reject duplicate runs"
        startedAt: { type: string }
        updatedAt: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowProgressEvent"
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowCheckpoint"
        review:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStepReview"
            - type: "null"
    WorkflowStep:
      type: object
      required: [id, type, title, importance, status, input, output, dependencies]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [input, generate, extract, analyze, transform, compose, remix, simulate, validate, compare, export, project]
        title: { type: string }
        description: { type: ["string", "null"] }
        importance:
          type: string
          enum: [required, recommended, optional]
        status:
          type: string
          enum: [pending, ready, running, complete, failed, skipped]
        input:
          type: array
          items: { type: string }
          description: "Artifact keys this step consumes"
        output:
          type: array
          items: { type: string }
          description: "Artifact keys this step produces"
        dependencies:
          type: array
          items: { type: string }
          description: "Ids of steps that must complete first"
        binding:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStepBinding"
            - type: "null"
        editableResultFields:
          type: array
          items: { type: string }
          description: "Server-declared generated-result fields that may be changed during review"
        result:
          type: ["object", "null"]
          additionalProperties: true
          description: "Step outcome summary recorded by the executor"
        error: { type: ["string", "null"] }
        progress:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStepProgress"
            - type: "null"
          description: "Persisted, safe generation progress for the latest execution"
    WorkflowRecord:
      type: object
      required: [id, title, intent, steps, artifacts, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        intent:
          $ref: "#/components/schemas/OutputIntent"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        artifacts:
          type: object
          additionalProperties: { type: string }
          description: "Artifact key → resource id (scenarioId, contentId, simulationId, …)"
        status:
          type: string
          enum: [draft, running, complete, failed]
        createdAt: { type: string }
        updatedAt: { type: string }
    WorkflowInput:
      type: object
      required: [title, intent, steps]
      properties:
        title: { type: string, minLength: 1 }
        intent:
          $ref: "#/components/schemas/OutputIntent"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
    WorkflowUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        artifacts:
          type: object
          additionalProperties: { type: string }
        status:
          type: string
          enum: [draft, running, complete, failed]
        expected:
          $ref: "#/components/schemas/WorkflowUpdateExpectation"
          description: "Required when changing steps, artifacts, or status; exact snapshot used to reject stale tabs"
    WorkflowUpdateExpectation:
      type: object
      required: [steps, artifacts, status]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        artifacts:
          type: object
          additionalProperties: { type: string }
        status:
          type: string
          enum: [draft, running, complete, failed]
    WorkflowPlanInput:
      type: object
      description: "Either outputType (choice) or description (natural language) is required; both may be given."
      properties:
        outputType:
          type: string
          enum: [movie, novel, roleplay, product-reaction, game, advertisement, remix, external-transform]
        description: { type: string }
        existingArtifacts:
          type: object
          additionalProperties: { type: string }
          description: "Artifact key → resource id from a prior workflow. Steps whose outputs are fully covered will be pre-marked complete so the new workflow only runs the remaining steps."
    WorkflowStepRunInput:
      type: object
      properties:
        params:
          type: object
          additionalProperties: true
          description: "User-provided inputs for this step (e.g. idea text, sample size)"
        rerun:
          type: boolean
          default: false
          description: "Re-run a completed step and invalidate its dependent outputs"
    WorkflowStepReviewInput:
      type: object
      required: [decision, expected]
      properties:
        decision:
          type: string
          enum: [approve]
        edits:
          type: object
          additionalProperties:
            type: string
          description: "Replacement text for server-declared editable result fields only"
        expected:
          $ref: "#/components/schemas/WorkflowUpdateExpectation"
          description: "Exact review snapshot used to reject stale tabs and concurrent edits"
