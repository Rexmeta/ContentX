openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ContentX API — platform-independent AI Content Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content
    description: Canonical content graph operations
  - name: projection
    description: Platform projections
  - name: character
    description: Canonical character and dimension registry operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/content:
    get:
      operationId: listContent
      tags: [content]
      summary: List all content
      responses:
        "200":
          description: Content list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentSummary"
    post:
      operationId: createContent
      tags: [content]
      summary: Generate a content graph from a natural language prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "201":
          description: Created content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
  /v1/scenarios/draft:
    post:
      operationId: draftScenario
      tags: [content]
      summary: Amplify a raw idea into a dramatic scenario draft for user confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioDraftInput"
      responses:
        "200":
          description: Amplified dramatic scenario (not yet committed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DramaticScenario"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI amplification failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios:
    get:
      operationId: listScenarios
      tags: [content]
      summary: List saved scenarios
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
    post:
      operationId: createScenario
      tags: [content]
      summary: Save a scenario to the scenario library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioSaveInput"
      responses:
        "201":
          description: Saved scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}:
    get:
      operationId: getScenario
      tags: [content]
      summary: Get a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateScenario
      tags: [content]
      summary: Update a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdateInput"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteScenario
      tags: [content]
      summary: Delete a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/categories:
    get:
      operationId: listCategories
      tags: [content]
      summary: List all categories (seed + auto-discovered)
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /v1/scenarios/synthesize:
    post:
      operationId: synthesizeScenario
      tags: [content]
      summary: Synthesize a new scenario draft from elements of saved scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeInput"
      responses:
        "200":
          description: Synthesized scenario draft with lineage (not yet persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesizeResult"
        "400":
          description: Invalid input or unknown source scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI synthesis failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/reclassify:
    post:
      operationId: reclassifyScenarios
      tags: [content]
      summary: Re-run classification for all scenarios
      responses:
        "200":
          description: Bulk reclassification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassifyResult"
  /v1/scenarios/{id}/classify:
    post:
      operationId: classifyScenario
      tags: [content]
      summary: Classify (or re-classify) a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario with fresh classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI classification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}/similar:
    get:
      operationId: listSimilarScenarios
      tags: [content]
      summary: Scenarios sharing category axes with the given scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Similar scenarios (shared domain or conflict type)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}:
    get:
      operationId: getContent
      tags: [content]
      summary: Get a content graph (current version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteContent
      tags: [content]
      summary: Delete content and its versions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /v1/content/{id}/entities/{entityId}:
    patch:
      operationId: updateEntity
      tags: [content]
      summary: Update an entity in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/relationships/{relationshipId}:
    patch:
      operationId: updateRelationship
      tags: [content]
      summary: Update a relationship in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: relationshipId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/validate:
    post:
      operationId: validateContent
      tags: [content]
      summary: Validate the content graph (schema, references, duplicates, required fields)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/versions:
    get:
      operationId: listVersions
      tags: [content]
      summary: List versions of a content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionInfo"
    post:
      operationId: createVersion
      tags: [content]
      summary: Snapshot the current graph as a new version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "201":
          description: New version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/export:
    get:
      operationId: exportContent
      tags: [content]
      summary: Export the canonical content graph JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canonical export document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalExport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/projections/roleplayx/{id}:
    get:
      operationId: projectRoleplayX
      tags: [projection]
      summary: Project a content graph to RoleplayX Scenario JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RoleplayX scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleplayXScenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dimensions:
    get:
      operationId: listDimensions
      tags: [character]
      summary: List all registered dimensions
      responses:
        "200":
          description: Dimension list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dimension"
    post:
      operationId: createDimension
      tags: [character]
      summary: Register a new dimension in the registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionInput"
      responses:
        "201":
          description: Registered dimension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        "400":
          description: Invalid dimension definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Dimension name already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters:
    get:
      operationId: listCharacters
      tags: [character]
      summary: List canonical characters
      responses:
        "200":
          description: Character list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [character]
      summary: Create a canonical character (dimension-validated attributes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid character (unknown group/dimension, bad value, MBTI as core attribute)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters/{id}:
    get:
      operationId: getCharacter
      tags: [character]
      summary: Get a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateCharacter
      tags: [character]
      summary: Update a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteCharacter
      tags: [character]
      summary: Delete a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [content]
      summary: Aggregate stats across the content library
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Entity:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Content primitive kind (character, person, value, trait, capability, population, organization, location, object, event, concept, theme, goal, conflict, emotion, action, dialogue, narrative, rule, constraint, outcome, world)"
        name: { type: string }
        canonicalName:
          type: ["string", "null"]
          description: "Stable canonical identity name; `name` is the display name"
        aliases:
          type: array
          items: { type: string, minLength: 1 }
          description: "Alternative names referring to the same canonical entity"
        description: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: true
    Relationship:
      type: object
      required: [id, source, type, target]
      properties:
        id: { type: string }
        source: { type: string }
        type: { type: string }
        target: { type: string }
        attributes:
          type: object
          additionalProperties: true
    Provenance:
      type: object
      required: [operation, createdAt]
      properties:
        operation: { type: string }
        createdAt: { type: string }
        sourceType: { type: ["string", "null"] }
        sourceUri: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        sourceContentIds:
          type: array
          items: { type: string }
        generatedByProvider: { type: ["string", "null"] }
        generatedByModel: { type: ["string", "null"] }
        lineage:
          description: Synthesis lineage carried from a synthesized scenario, when the graph was built from one
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Lineage"
    ContentGraph:
      type: object
      required: [id, title, version, createdAt, updatedAt, entities, relationships]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        provenance:
          $ref: "#/components/schemas/Provenance"
    ContentSummary:
      type: object
      required: [id, title, version, createdAt, updatedAt, entityCount, relationshipCount]
      properties:
        id: { type: string }
        title: { type: string }
        sourcePrompt: { type: ["string", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        entityCount: { type: integer }
        relationshipCount: { type: integer }
    ContentInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioDraftInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        title:
          type: string
    ScenarioAct:
      type: object
      required: [name, summary, beats]
      properties:
        name: { type: string }
        summary: { type: string }
        beats:
          type: array
          items: { type: string }
    ScenarioCharacter:
      type: object
      required: [name, role, motivation]
      properties:
        name: { type: string }
        role: { type: string }
        motivation: { type: string }
    DramaticScenario:
      type: object
      required: [title, logline, synopsis, theme, stakes, twist, acts, characters]
      properties:
        title: { type: string }
        logline: { type: string }
        synopsis: { type: string }
        theme: { type: string }
        stakes: { type: string }
        twist: { type: string }
        acts:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioAct"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioCharacter"
        sourceIdea: { type: string }
        amplifiedBy: { type: string }
    ScenarioElement:
      type: string
      enum: [characters, conflict, setting, twist, structure]
      description: Which element to borrow from a source scenario
    SynthesisSource:
      type: object
      required: [scenarioId, elements]
      properties:
        scenarioId: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioElement"
    SynthesizeInput:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/SynthesisSource"
        instruction:
          type: string
          description: Optional free-form guidance for the synthesis
    LineageParent:
      type: object
      required: [scenarioId, title, elements]
      properties:
        scenarioId: { type: string }
        title: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioElement"
    Lineage:
      type: object
      required: [parents]
      properties:
        parents:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/LineageParent"
        instruction: { type: ["string", "null"] }
        synthesizedBy: { type: ["string", "null"] }
    SynthesizeResult:
      type: object
      required: [scenario, lineage]
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioSaveInput:
      type: object
      required: [idea, scenario]
      properties:
        idea:
          type: string
          minLength: 1
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        lineage:
          $ref: "#/components/schemas/Lineage"
    ScenarioUpdateInput:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          description: Manual classification override; when present it is stored as-is (no auto-classify)
          $ref: "#/components/schemas/Classification"
    Classification:
      type: object
      required: [domain, conflictType, tone, tags]
      properties:
        domain: { type: string }
        conflictType: { type: string }
        tone: { type: string }
        tags:
          type: array
          items: { type: string }
        classifiedBy: { type: ["string", "null"] }
    Category:
      type: object
      required: [id, axis, name, origin]
      properties:
        id: { type: string }
        axis:
          type: string
          enum: [domain, conflictType, tone]
        name: { type: string }
        description: { type: ["string", "null"] }
        origin:
          type: string
          enum: [seed, auto]
    ReclassifyResult:
      type: object
      required: [classified, failed]
      properties:
        classified: { type: integer }
        failed: { type: integer }
    ScenarioRecord:
      type: object
      required: [id, title, idea, scenario, classification, lineage, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        idea: { type: string }
        scenario:
          $ref: "#/components/schemas/DramaticScenario"
        classification:
          oneOf:
            - $ref: "#/components/schemas/Classification"
            - type: "null"
        lineage:
          oneOf:
            - $ref: "#/components/schemas/Lineage"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
    Dimension:
      type: object
      required: [id, name, category, dataType, source, version]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [demographic, professional, psychological, behavioral, social, preference, capability, technology, domain]
        dataType:
          type: string
          enum: [string, number, boolean, enum, array]
        allowedValues:
          oneOf:
            - type: array
              items: { type: string }
            - type: "null"
