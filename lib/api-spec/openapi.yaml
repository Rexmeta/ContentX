openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ContentX API — platform-independent AI Content Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content
    description: Canonical content graph operations
  - name: projection
    description: Platform projections
  - name: character
    description: Canonical character and dimension registry operations
  - name: population
    description: Population, dependency rule, and deterministic sampling operations
  - name: agent
    description: Character snapshots and agent runtime operations
  - name: simulation
    description: Simulation runs, interaction traces, and evaluations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/content:
    get:
      operationId: listContent
      tags: [content]
      summary: List all content
      responses:
        "200":
          description: Content list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentSummary"
    post:
      operationId: createContent
      tags: [content]
      summary: Generate a content graph from a natural language prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "201":
          description: Created content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
  /v1/content/import/matraix:
    post:
      operationId: importMatraixContent
      tags: [content]
      summary: Import a MatrAIx dataset as a canonical content graph
      description: >
        Maps a MatrAIx export (world, populations, personas, relations) into
        canonical entities/relationships with provenance sourceType "matraix",
        and returns the committed graph plus a validation/import report
        (duplicates, broken references). If a graph with the same source.uri
        was imported before, that graph is updated in place as a new version
        (version +1) instead of creating a duplicate, and the report includes
        a diff against the previous graph. With dryRun the mapping, report,
        and re-import diff are returned without committing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatraixImportInput"
      responses:
        "201":
          description: Imported content graph plus import report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatraixImportResult"
        "400":
          description: Invalid MatrAIx dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/draft:
    post:
      operationId: draftScenario
      tags: [content]
      summary: Amplify a raw idea into a dramatic scenario draft for user confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioDraftInput"
      responses:
        "200":
          description: Amplified dramatic scenario (not yet committed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DramaticScenario"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI amplification failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios:
    get:
      operationId: listScenarios
      tags: [content]
      summary: List saved scenarios
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
    post:
      operationId: createScenario
      tags: [content]
      summary: Save a scenario to the scenario library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioSaveInput"
      responses:
        "201":
          description: Saved scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}:
    get:
      operationId: getScenario
      tags: [content]
      summary: Get a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateScenario
      tags: [content]
      summary: Update a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdateInput"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteScenario
      tags: [content]
      summary: Delete a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/categories:
    get:
      operationId: listCategories
      tags: [content]
      summary: List all categories (seed + auto-discovered)
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /v1/scenarios/synthesize:
    post:
      operationId: synthesizeScenario
      tags: [content]
      summary: Synthesize a new scenario draft from elements of saved scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeInput"
      responses:
        "200":
          description: Synthesized scenario draft with lineage (not yet persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesizeResult"
        "400":
          description: Invalid input or unknown source scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI synthesis failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/bridge/analyze:
    post:
      operationId: analyzeBridge
      tags: [content]
      summary: Analyze the narrative gap between a source and a target scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeAnalyzeInput"
      responses:
        "200":
          description: Structured connection analysis with draft transition requirements (not persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeAnalysis"
        "400":
          description: Invalid input or unknown scenarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI analysis failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/bridge:
    post:
      operationId: bridgeScenario
      tags: [content]
      summary: Generate a bridge scenario draft connecting a source to a target scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeGenerateInput"
      responses:
        "200":
          description: Bridge scenario draft with bridge lineage (not yet persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesizeResult"
        "400":
          description: Invalid input or unknown scenarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI bridge generation failed (provider error or invalid AI output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/reclassify:
    post:
      operationId: reclassifyScenarios
      tags: [content]
      summary: Re-run classification for all scenarios
      responses:
        "200":
          description: Bulk reclassification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassifyResult"
  /v1/scenarios/{id}/classify:
    post:
      operationId: classifyScenario
      tags: [content]
      summary: Classify (or re-classify) a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scenario with fresh classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: AI classification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/benchmark:
    post:
      operationId: benchmarkScenarios
      tags: [content]
      summary: Build a group pattern report from a reference set of scenarios
      description: >
        Aggregates classifications (domain/conflictType/tone/tags) across the
        selected scenario set and returns a group-characteristic profile.
        The draftConstraints field is ready to inject into a draft_story step
        as a benchmark constraint. Requires at least 2 scenarios — N=1 is
        rejected with 400 (invariant: group characteristics, not single-source
        reproduction).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkInput"
      responses:
        "200":
          description: Group pattern report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkReport"
        "400":
          description: Fewer than 2 distinct scenario IDs, or unknown scenario IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/scenarios/{id}/similar:
    get:
      operationId: listSimilarScenarios
      tags: [content]
      summary: Scenarios sharing category axes with the given scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Similar scenarios (shared domain or conflict type)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}:
    get:
      operationId: getContent
      tags: [content]
      summary: Get a content graph (current version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteContent
      tags: [content]
      summary: Delete content and its versions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /v1/content/{id}/entities/{entityId}:
    patch:
      operationId: updateEntity
      tags: [content]
      summary: Update an entity in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/relationships/{relationshipId}:
    patch:
      operationId: updateRelationship
      tags: [content]
      summary: Update a relationship in the content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: relationshipId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipUpdate"
      responses:
        "200":
          description: Updated content graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGraph"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/validate:
    post:
      operationId: validateContent
      tags: [content]
      summary: Validate the content graph (schema, references, duplicates, required fields)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/versions:
    get:
      operationId: listVersions
      tags: [content]
      summary: List versions of a content graph
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionInfo"
    post:
      operationId: createVersion
      tags: [content]
      summary: Snapshot the current graph as a new version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "201":
          description: New version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/content/{id}/export:
    get:
      operationId: exportContent
      tags: [content]
      summary: Export the canonical content graph JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canonical export document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalExport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/projections:
    post:
      operationId: createProjection
      tags: [projection]
      summary: Project canonical content and/or simulation results to a runtime target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectionInput"
      responses:
        "200":
          description: Projection result (computed, not persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResult"
        "400":
          description: Invalid projection request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Content or simulation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Projection generation failed (provider error or invalid output)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/projections/roleplayx/{id}:
    get:
      operationId: projectRoleplayX
      tags: [projection]
      summary: Project a content graph to RoleplayX Scenario JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RoleplayX scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleplayXScenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/dimensions:
    get:
      operationId: listDimensions
      tags: [character]
      summary: List all registered dimensions
      responses:
        "200":
          description: Dimension list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dimension"
    post:
      operationId: createDimension
      tags: [character]
      summary: Register a new dimension in the registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionInput"
      responses:
        "201":
          description: Registered dimension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        "400":
          description: Invalid dimension definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Dimension name already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters:
    get:
      operationId: listCharacters
      tags: [character]
      summary: List canonical characters
      responses:
        "200":
          description: Character list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [character]
      summary: Create a canonical character (dimension-validated attributes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid character (unknown group/dimension, bad value, MBTI as core attribute)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/characters/{id}:
    get:
      operationId: getCharacter
      tags: [character]
      summary: Get a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateCharacter
      tags: [character]
      summary: Update a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteCharacter
      tags: [character]
      summary: Delete a canonical character
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations:
    get:
      operationId: listPopulations
      tags: [population]
      summary: List populations
      responses:
        "200":
          description: Population list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Population"
    post:
      operationId: createPopulation
      tags: [population]
      summary: Create a population (cohort definition over registered dimensions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationInput"
      responses:
        "201":
          description: Created population
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "400":
          description: Invalid population definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}:
    get:
      operationId: getPopulation
      tags: [population]
      summary: Get a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Population
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: updatePopulation
      tags: [population]
      summary: Update a population (version increments; previous definition kept in history)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationUpdate"
      responses:
        "200":
          description: Updated population (version bumped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Population"
        "400":
          description: Invalid definition (or existing rules reference removed dimensions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deletePopulation
      tags: [population]
      summary: Delete a population (cascades rules and sampling audit)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}/definition:
    get:
      operationId: getPopulationDefinition
      tags: [population]
      summary: Resolve the exact historical definition + rule set behind a pinned populationVersion + dependencyGraphVersion pair (reproducibility)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: populationVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: dependencyGraphVersion
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Historical population definition and rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopulationDefinitionAt"
        "404":
          description: Population or stored version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/populations/{id}/dependencies:
    get:
      operationId: listDependencyRules
      tags: [population]
      summary: List statistical dependency rules of a population
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dependency rule list
          content:
            application/json:
              schema:
                type: array
